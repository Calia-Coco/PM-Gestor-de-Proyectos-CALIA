<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Ejecutivo Toborochi</title>
<style>
  :root{ color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body{ margin:0; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<title>Comité Toborochi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  /* Identidad Toborochi — verde de la línea gráfica del proyecto (#014F59,
     tomado directamente del fondo de portada de la plantilla oficial).
     Look único y deliberado (no depende del tema del visor): fondo verde
     de marca, texto claro con contraste AA+, coral de marca como acento
     interactivo, y un encabezado claro que contrasta a propósito con el
     cuerpo y aloja el logotipo de Toborochi.
     Fondo aclarado (sept/2026) respecto al original #014F59: se sube la
     luminosidad de --bg/--bg-2 (único par usado directamente detrás del
     texto, en body y en el detalle de decisiones) para que las tarjetas
     (--surface y derivados, sin cambios) resalten más en toda la
     plataforma. Recalculado y verificado: el texto --text sobre el nuevo
     --bg sigue en ~5:1 (AA para texto normal). */
  :root{
    --bg:#0E6A76;
    --bg-2:#0B616C;
    --surface:#155D66;
    --surface-2:#256870;
    --surface-3:#39767E;
    --border:#488087;
    --border-soft:#2F6F77;
    --text:#DBE9EA;
    --text-muted:#ABC0C2;
    --text-faint:#8FA3A5;
    --primary:#2FD6C0;
    --primary-dark:#1FA894;
    --primary-tint:rgba(47,214,192,.16);
    --accent:#F58675;
    --accent-dark:#E36C58;
    --accent-tint:rgba(245,134,117,.16);
    --rag-green:#92C25A;
    --rag-green-tint:rgba(146,194,90,.16);
    --rag-amber:#f0b94a;
    --rag-amber-tint:rgba(240,185,74,.16);
    --rag-red:#FF9E8E;
    --rag-red-tint:rgba(255,158,142,.16);
    --rag-gray:#8FA3A5;
    --rag-gray-tint:rgba(143,163,165,.14);
    --rag-cyan:#6FC3E0;
    --rag-cyan-tint:rgba(111,195,224,.16);
    --risk-bajo:#92C25A;
    --risk-medio:#f0b94a;
    --risk-alto:#FFA866;
    --risk-critico:#FF9C92;
    --sidebar-a:#013E45;
    --sidebar-b:#014A54;
    --topbar-bg:#DBE9EA;
    --topbar-text:#1B2E31;
    --topbar-text-muted:#536366;
    --topbar-border:rgba(1,58,66,.14);
    --flag-red:#C93327;
    --flag-red-tint:rgba(201,51,39,.16);
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 12px 32px -12px rgba(0,0,0,.55);
    --radius:14px;

    /* Recuadros KPI — degradés suaves de color combinado (color semántico
       mezclado con la superficie de tarjeta, hacia --surface-2). Valores
       precalculados y verificados contra WCAG AA para el texto que va encima. */
    --tint-primary-soft:#18696F;
    --tint-accent-soft:#2B6168;
    --tint-rag-green-soft:#226765;
    --tint-rag-amber-soft:#2B6663;
    --tint-rag-red-soft:#2C646A;
    --tint-rag-gray-soft:#21646C;
    --tint-risk-alto-soft:#2C6466;
    --tint-risk-critico-soft:#2C636A;
    --text-muted-tint:#D2DEDF;
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:'Source Sans 3',system-ui,sans-serif; margin:0;}
  h1,h2,h3,h4{font-family:'Manrope',system-ui,sans-serif; margin:0; text-wrap:balance;}
  a{color:inherit;}
  button{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:236px; flex:0 0 236px; background:linear-gradient(180deg,var(--sidebar-a),var(--sidebar-b));
    color:#eaf4f4; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
    border-right:1px solid rgba(255,255,255,.06);
  }
  .brand{padding:22px 20px 14px; display:flex; align-items:center; gap:10px;}
  .brand .mark{width:30px; height:auto; flex:0 0 auto; display:block;}
  .brand .name{font-family:'Manrope'; font-weight:800; font-size:16.5px; letter-spacing:.2px;}
  .brand .sub{font-size:11px; color:#bcdada; margin-top:1px;}
  nav.primary{padding:8px 12px; display:flex; flex-direction:column; gap:2px; flex:1;}
  .navgroup-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:#8fc2c4; padding:14px 10px 6px;}
  .navitem{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; font-size:13.6px; font-weight:600; color:#d3ebeb; cursor:pointer; border:1px solid transparent; background:none; text-align:left; width:100%;}
  .navitem svg{width:16px; height:16px; flex:0 0 auto; opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,.06);}
  .navitem.active{background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.12);}
  .navitem .count{margin-left:auto; font-size:11px; padding:1px 7px; border-radius:999px; background:rgba(255,255,255,.14); font-family:'JetBrains Mono';}
  .navitem .count.hot{background:var(--accent); color:#2a1208;}
  #sidebar .footer{padding:12px; border-top:1px solid rgba(255,255,255,.12);}
  .modebox{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px; font-size:12px; color:#bfe0e0;}
  .modebox b{color:#fff; display:block; font-size:12.5px; margin-bottom:2px;}
  .accesspill{display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:11px; padding:3px 8px; border-radius:999px;}
  .accesspill.editor{background:rgba(126,172,64,.25); color:#d9f2c2;}
  .accesspill.viewer{background:rgba(255,255,255,.12); color:#d3ebeb;}

  /* Main */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  /* El encabezado usa un fondo claro (--topbar-bg) para contrastar a
     propósito con el verde de marca del cuerpo, y aloja el logotipo. */
  #topbar{position:sticky; top:0; z-index:5; background:var(--topbar-bg); box-shadow:0 1px 0 var(--topbar-border), 0 6px 18px -10px rgba(0,0,0,.35); padding:12px 28px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .topbar-logo{height:26px; width:auto; flex:0 0 auto; display:block;}
  #topbar .titles{margin-right:auto;}
  #topbar h1{font-size:18px; color:var(--topbar-text);}
  #topbar .crumb{font-size:12px; color:var(--topbar-text-muted); margin-top:2px;}
  .updated{font-size:11.5px; color:var(--topbar-text-muted); display:flex; align-items:center; gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--rag-green);}

  main.view{padding:24px 28px 60px; max-width:1280px; width:100%; margin:0 auto;}
  .section-head{margin-bottom:18px;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--accent); font-weight:700; margin-bottom:4px;}
  .section-head h2{font-size:23px;}
  .section-head p{color:var(--text-muted); font-size:13.5px; margin-top:5px; max-width:70ch;}

  .grid{display:grid; gap:16px;}
  .kpirow{grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:20px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .kpi .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted-tint); font-weight:600;}
  .kpi .value{font-family:'Manrope'; font-weight:800; font-size:26px; font-variant-numeric:tabular-nums; line-height:1.15;}
  .kpi .value small{font-size:13px; font-weight:700; color:var(--text-muted-tint);}
  .kpi .foot{font-size:12px; color:var(--text-faint); line-height:1.4;}
  /* Cada tarjeta apila etiqueta → gráfico → valor → pie en flujo normal,
     todo con altura automática, para que el texto nunca quede debajo
     (superpuesto) de un gráfico más alto de lo previsto.
     NOTA: "all:unset" en un <button> resetea TAMBIÉN background/padding/
     border/box-shadow/position — por eso el recuadro de tarjeta se declara
     aquí mismo (después del unset), en vez de en la clase compartida .kpi,
     que un <button> nunca llegaría a aplicar. */
  button.kpi{
    all:unset; box-sizing:border-box; position:relative; display:flex; flex-direction:column; gap:9px;
    cursor:pointer; width:100%; padding:16px 18px;
    background:var(--kpi-bg, var(--surface));
    border:1px solid var(--border);
    border-left:3px solid var(--kpi-edge, var(--border-soft));
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:transform .12s, border-color .12s, box-shadow .12s, background .12s;
  }
  button.kpi:hover{border-color:var(--primary); transform:translateY(-2px); box-shadow:0 1px 2px rgba(0,0,0,.25), 0 16px 34px -14px rgba(0,0,0,.6);}
  button.kpi:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  .kpi .kpitop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .kpi .goarrow{color:var(--text-faint); flex:0 0 auto; transition:transform .12s, color .12s;}
  button.kpi:hover .goarrow{color:var(--accent); transform:translateX(2px);}
  .kpi .miniviz{display:flex; align-items:center; gap:12px; min-height:30px;}
  .kpi .miniviz svg{display:block; max-width:100%; height:auto; flex:0 0 auto;}
  .kpi .miniviz .ringval{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .kpi .miniviz .ringval-num{font-family:'Manrope'; font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; line-height:1;}

  .panel{padding:20px; margin-bottom:18px;}
  .panel h3{font-size:15px; margin-bottom:2px;}
  .panel .hint{font-size:12.5px; color:var(--text-muted); margin-bottom:14px;}

  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .chip.verde{background:var(--rag-green-tint); color:var(--rag-green);}
  .chip.amarillo{background:var(--rag-amber-tint); color:var(--rag-amber);}
  .chip.rojo{background:var(--rag-red-tint); color:var(--rag-red);}
  .chip.gris{background:var(--rag-gray-tint); color:var(--rag-gray);}
  .chip.celeste{background:var(--rag-cyan-tint); color:var(--rag-cyan);}
  .chip::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .bar-track{height:8px; border-radius:999px; background:var(--surface-3); overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px;}

  .q3{grid-template-columns:repeat(2,1fr); margin-bottom:18px;}
  .q3 .card{padding:18px; display:flex; flex-direction:column; gap:10px;}
  .q3 .qlabel{font-family:'Manrope'; font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:8px;}
  .q3 .qnum{width:24px;height:24px;border-radius:7px;background:var(--primary-tint); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:0 0 auto;}
  .q3 ul{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .q3 li{font-size:13px; line-height:1.4; padding-left:14px; position:relative; color:var(--text);}
  .q3 li::before{content:'—'; position:absolute; left:0; color:var(--text-faint);}
  .q3 .empty{color:var(--text-faint); font-size:12.5px; font-style:italic;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .tablewrap{overflow-x:auto;}
  .code{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--text-muted); background:var(--surface-2); padding:1px 6px; border-radius:5px;}

  .frentelist{display:flex; flex-direction:column; gap:12px;}
  .frenterow{display:grid; grid-template-columns:1fr auto 120px auto; gap:14px; align-items:center; padding:12px 14px; background:var(--surface-2); border-radius:11px;}
  button.frenterow{all:unset; box-sizing:border-box; display:grid; grid-template-columns:1fr auto 120px auto; gap:14px; align-items:center; padding:12px 14px; background:var(--surface-2); border-radius:11px; width:100%; cursor:pointer; border:1px solid transparent; transition:border-color .12s, background .12s;}
  button.frenterow:hover{border-color:var(--primary); background:var(--surface-3);}
  button.frenterow:hover .fname{color:var(--accent);}
  .frenterow .fname{font-weight:600; font-size:13.5px; transition:color .12s;}
  .frenterow .fcomment{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .frenterow .goarrow{color:var(--text-faint);}

  .msglist{display:flex; flex-direction:column; gap:9px;}
  .msglist li{list-style:none; font-size:13.5px; line-height:1.45; padding:10px 12px; background:var(--primary-tint); border-left:3px solid var(--primary); border-radius:0 8px 8px 0;}

  /* Gantt */
  .gantt-wrap{overflow-x:auto;}
  .gantt{min-width:920px;}
  .gantt-months{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(64px,1fr); border-bottom:1px solid var(--border); padding-left:220px; position:relative;}
  .gantt-months span{font-size:10.5px; text-transform:uppercase; color:var(--text-muted); padding:4px 4px; border-left:1px dashed var(--border); font-weight:600;}
  .gantt-row{display:flex; align-items:center; min-height:40px; border-bottom:1px solid var(--border);}
  .gantt-row:hover{background:var(--surface-2);}
  .gantt-label{width:220px; flex:0 0 220px; font-size:12.5px; padding:4px 10px 4px 0; display:flex; flex-direction:column; gap:2px;}
  .gantt-label b{font-size:12.5px; font-weight:600;}
  .gantt-label span{font-size:10.5px; color:var(--text-faint);}
  .gantt-track{flex:1; position:relative; height:32px; background:repeating-linear-gradient(90deg, transparent, transparent calc(var(--colw,64px) - 1px), var(--border) calc(var(--colw,64px) - 1px), var(--border) var(--colw,64px));}
  .gantt-plan{position:absolute; top:4px; height:12px; border:1.5px dashed var(--text-faint); border-radius:6px; box-sizing:border-box;}
  .gantt-real{position:absolute; top:19px; height:10px; border-radius:5px;}
  .gantt-today{position:absolute; top:0; width:2px; background:var(--accent); z-index:2;}
  .gantt-milestone{position:absolute; top:2px; width:16px; height:16px; transform:translateX(-50%) rotate(45deg); border-radius:3px; z-index:3; box-shadow:var(--shadow);}
  .gantt-row--critical{background:var(--flag-red-tint);}
  .gantt-row--critical:hover{background:var(--flag-red-tint);}
  .gantt-row--critical .gantt-label b{color:var(--flag-red);}
  .gantt-row--critical .gantt-plan{border-color:var(--flag-red);}
  .gantt-row--critical .gantt-real{box-shadow:0 0 0 1.5px var(--flag-red);}
  .cp-tag{font-size:9px; font-weight:700; letter-spacing:.04em; color:var(--flag-red); background:rgba(201,51,39,.22); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:1px; white-space:nowrap;}
  .pmg-flag{font-size:9px; font-weight:700; letter-spacing:.03em; border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:1px; white-space:nowrap; display:inline-block;}
  .pmg-flag.amarillo{color:var(--rag-amber); background:var(--rag-amber-tint);}
  .pmg-flag.rojo{color:var(--flag-red); background:var(--flag-red-tint);}
  .pmg-riskbtn{font-size:10.5px; font-weight:700; color:var(--primary); background:none; border:1px solid var(--border); border-radius:6px; padding:1px 7px; cursor:pointer; align-self:flex-start;}
  .pmg-riskbtn:hover{border-color:var(--primary);}
  .pmg-riskbtn.muted{color:var(--text-faint); cursor:default; border-style:dashed;}
  .pmg-riskpanel{margin-top:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2);}
  .pmg-editrow{cursor:pointer;}
  .pmg-editrow:hover{outline:1.5px solid var(--primary); outline-offset:-1px;}
  .pmg-month{position:absolute; top:0; bottom:0; font-size:10.5px; text-transform:uppercase; color:var(--text-muted); padding:4px 4px; border-left:1px dashed var(--border); font-weight:600; white-space:nowrap; overflow:hidden;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin-top:12px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:12px;height:12px;border-radius:3px; display:inline-block;}

  /* Risk matrix */
  .matrix{display:grid; grid-template-columns:28px repeat(3,1fr); grid-template-rows:repeat(3,64px) 24px; gap:6px; max-width:520px;}
  .matrix .axis-y{grid-row:1/4; writing-mode:vertical-rl; transform:rotate(180deg); font-size:10.5px; text-transform:uppercase; color:var(--text-muted); text-align:center; font-weight:700; letter-spacing:.06em;}
  .matrix .cell{border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Manrope'; font-weight:800; font-size:19px; color:#fff;}
  .matrix .axis-x{font-size:10.5px; text-transform:uppercase; color:var(--text-muted); text-align:center; font-weight:700; letter-spacing:.06em; align-self:center;}

  .riskbadge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; letter-spacing:.02em; padding:3px 10px; border-radius:999px; text-transform:uppercase; white-space:nowrap;}
  .riskbadge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .riskbadge.critico{background:rgba(239,91,82,.18); color:var(--risk-critico);}
  .riskbadge.alto{background:rgba(242,145,74,.18); color:var(--risk-alto);}
  .riskbadge.medio{background:rgba(240,185,74,.16); color:var(--risk-medio);}
  .riskbadge.bajo{background:rgba(78,207,139,.16); color:var(--risk-bajo);}
  .risktier-head{display:flex; align-items:center; gap:8px; margin:20px 0 8px; font-family:'Manrope'; font-weight:700; font-size:13px;}
  .risktier-head:first-child{margin-top:0;}

  .backlink{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:0; margin-bottom:14px;}
  .backlink:hover{color:var(--accent);}

  /* EDT / WBS */
  .edt-wrap{display:flex; flex-direction:column; gap:14px;}
  .edt-root{display:flex; align-items:center; gap:10px; font-family:'Manrope'; font-weight:800; font-size:15px; padding:14px 18px; background:var(--surface-2); border-radius:12px; border:1px solid var(--border);}
  .edt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;}
  button.edt-node{all:unset; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; padding:15px 16px; background:var(--surface); border:1px solid var(--border); border-radius:13px; cursor:pointer; transition:border-color .12s, transform .12s;}
  button.edt-node:hover{border-color:var(--primary); transform:translateY(-2px); box-shadow:var(--shadow);}
  .edt-node .entop{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .edt-node .enname{font-weight:700; font-size:13px; line-height:1.3;}
  .edt-node .enpct{font-family:'Manrope'; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums;}
  .edt-node .enmetrics{display:flex; gap:8px; font-size:11px;}
  .metricpill{padding:2px 8px; border-radius:7px; background:var(--surface-2); font-family:'JetBrains Mono'; font-weight:600; display:flex; align-items:center; gap:4px;}
  .metricpill .mlabel{color:var(--text-faint); font-family:'Source Sans 3'; font-weight:700; letter-spacing:.03em;}
  .metricpill.good{color:var(--rag-green);}
  .metricpill.bad{color:var(--rag-red);}
  .metricpill.na{color:var(--text-faint);}

  .scurve-card{padding:22px;}
  .scurve-svg{width:100%; height:auto; display:block;}
  .scurve-legend{display:flex; gap:18px; margin-top:10px; font-size:12px; color:var(--text-muted); flex-wrap:wrap;}
  .scurve-legend span{display:inline-flex; align-items:center; gap:6px;}
  .scurve-legend i{width:14px; height:2px; display:inline-block; border-radius:2px;}
  .scurve-legend i.dashed{background:repeating-linear-gradient(90deg,var(--text-faint) 0 4px, transparent 4px 7px);}

  .decisiontable td.actioncol{font-weight:600;}
  .expected{color:var(--text-muted); font-size:12.5px;}
  .decisionrow{cursor:pointer; transition:background .12s;}
  .decisionrow:hover{background:var(--surface-2);}
  .decisiondetail td{background:var(--bg-2); border-top:none; padding:4px 14px 16px;}
  .decisiondetail[hidden]{display:none;}

  .cardfoot-link{margin-top:12px; font-size:12.5px; font-weight:700; color:var(--primary); cursor:pointer; display:inline-block;}
  .cardfoot-link:hover{color:var(--accent);}

  .flagbadge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .flagbadge.on{background:var(--flag-red-tint); color:var(--flag-red);}
  .flagbadge.off{background:var(--surface-2); color:var(--text-faint); font-weight:600;}
  .updateslog{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .updateslog li{display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; padding:8px 10px; background:var(--surface-2); border-radius:9px; align-items:baseline;}
  .ulog-date{font-family:'JetBrains Mono'; font-size:11px; color:var(--text-faint); flex:0 0 auto;}
  .ulog-autor{font-weight:700; color:var(--text-muted); flex:0 0 auto;}
  .ulog-nota{color:var(--text); flex:1 1 200px;}

  .checkboxfield{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--text); cursor:pointer; padding:9px 0;}
  .checkboxfield input[type="checkbox"]{width:17px; height:17px; accent-color:var(--flag-red); cursor:pointer; flex:0 0 auto;}

  /* Backoffice */
  .adminbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .tab{padding:7px 13px; border-radius:9px; font-size:12.5px; font-weight:600; background:var(--surface-2); border:1px solid var(--border); cursor:pointer; color:var(--text-muted);}
  .tab.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:9px; font-size:13px; font-weight:700; border:1px solid transparent; cursor:pointer;}
  .btn.primary{background:var(--primary); color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.ghost{background:var(--surface); border-color:var(--border); color:var(--text);}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.danger{background:var(--rag-red-tint); color:var(--rag-red);}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .rowactions{display:flex; gap:6px;}

  .formcard{padding:20px;}
  .formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px; font-weight:700; color:var(--text-muted);}
  .field .fhint{font-size:11px; color:var(--text-faint); margin-top:-2px;}
  input,select,textarea{font-family:inherit; font-size:13.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); width:100%;}
  textarea{min-height:78px; resize:vertical; font-family:'JetBrains Mono'; font-size:12px; line-height:1.5;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary); outline-offset:1px;}

  .noaccess{padding:40px; text-align:center; color:var(--text-muted);}
  .toast{position:fixed; bottom:20px; right:20px; background:var(--primary-dark); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); z-index:50; display:flex; align-items:center; gap:8px; transition:opacity .25s, transform .25s;}
  .toast.err{background:var(--rag-red);}
  .csvbox{border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center; color:var(--text-muted); font-size:13px;}
  .csvbox.drag{border-color:var(--primary); background:var(--primary-tint);}
  .maptable td{padding:6px 8px;}

  .acta{padding:18px 20px; margin-bottom:14px;}
  .acta summary{cursor:pointer; font-weight:700; font-size:14px; list-style:none; display:flex; align-items:center; justify-content:space-between;}
  .acta summary::-webkit-details-marker{display:none;}
  .acta summary .arrow{transition:transform .15s; color:var(--text-faint);}
  .acta[open] summary .arrow{transform:rotate(90deg);}
  .acta .body{margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .acta h5{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin-bottom:8px;}
  .acta ul{margin:0; padding-left:16px; font-size:13px; line-height:1.5;}

  .milestonelist{display:flex; flex-direction:column;}
  .mrow{display:flex; gap:14px; padding:12px 4px; border-left:2px solid var(--border); margin-left:9px; padding-left:20px; position:relative;}
  .mrow::before{content:''; position:absolute; left:-7px; top:16px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--rag-gray);}
  .mrow.done::before{background:var(--rag-green); border-color:var(--rag-green);}
  .mrow.risk::before{background:var(--rag-red); border-color:var(--rag-red);}
  .mrow.prog::before{background:var(--rag-cyan); border-color:var(--rag-cyan);}
  .mrow .date{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--text-muted); width:96px; flex:0 0 auto; padding-top:1px;}

  /* Botón de menú (hamburguesa) — sólo visible en móvil, ver media query. */
  .menubtn{display:none; all:unset; box-sizing:border-box; width:34px; height:34px; flex:0 0 auto; align-items:center; justify-content:center; border-radius:9px; color:var(--topbar-text); cursor:pointer; font-size:19px; line-height:1;}
  .menubtn:hover{background:rgba(1,58,66,.08);}
  .menubtn:active{background:rgba(1,58,66,.14);}
  #sidebarBackdrop{display:none; position:fixed; inset:0; background:rgba(1,20,23,.45); z-index:19; opacity:0; transition:opacity .18s;}
  #sidebarBackdrop.show{display:block; opacity:1;}

  @media (max-width:880px){
    #app{display:block;}
    .menubtn{display:inline-flex;}
    #sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .2s; z-index:20; width:82vw; max-width:280px;}
    #sidebar.open{transform:translateX(0); box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    #main{min-width:0;}
    main.view{padding:18px 14px 60px;}
    .q3{grid-template-columns:1fr;}
    .kpirow{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
    .acta .body{grid-template-columns:1fr;}
    #topbar{padding:10px 14px; gap:10px;}
    #topbar .titles{min-width:0;}
    #topbar h1{font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    #topbar .crumb{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .topbar-logo{height:20px;}
    .updated{display:none;}
    .frenterow, button.frenterow{grid-template-columns:1fr auto; grid-template-areas:"name chip" "bar bar" "arrow arrow"; row-gap:8px;}
    .frenterow > div:first-child{grid-area:name;}
    .frenterow .chip{grid-area:chip; justify-self:end;}
    .frenterow > div:nth-child(3){grid-area:bar;}
    .frenterow .goarrow{grid-area:arrow; justify-self:end;}
    .edt-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
    .formgrid{grid-template-columns:1fr;}
    .matrix{max-width:100%;}
    .matrix .cell{font-size:15px;}
    table{font-size:12px;}
    th,td{padding:7px 6px;}
    .adminbar{gap:6px;}
    .tab{padding:6px 10px; font-size:12px;}
  }
  @media (max-width:480px){
    .section-head h2{font-size:19px;}
    .kpi .value{font-size:21px;}
    .kpirow{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
    .edt-grid{grid-template-columns:1fr 1fr;}
    #sidebar{width:86vw;}
  }

  /* =====================================================================
     LOGIN — pantalla de acceso por rol (Comité / PMO / Equipo Técnico).
     Filtro simple del lado del cliente, no es autenticación real.
  ===================================================================== */
  .login-screen{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    padding:24px; background:radial-gradient(circle at 30% 20%, var(--bg-2), #06363c 78%); overflow:auto;}
  .login-card{width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:36px 32px 28px; box-shadow:0 30px 70px rgba(0,0,0,.35); text-align:center;}
  .login-logos{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .login-logo-toborochi{height:34px; width:auto; display:block;}
  .login-logo-sep{width:1px; height:26px; background:var(--border);}
  .login-wordmark-mamayatech{font-family:'Manrope',sans-serif; font-weight:800; font-size:17px; letter-spacing:-.01em; color:var(--text); cursor:help;}
  .login-wordmark-mamayatech span{color:var(--accent);}
  .login-card h1{font-family:'Manrope',sans-serif; font-size:22px; font-weight:800; margin:0 0 4px; color:var(--text);}
  .login-sub{font-size:12.5px; color:var(--text-muted); margin:0 0 26px;}
  .login-roles{display:flex; flex-direction:column; gap:10px;}
  .role-btn{all:unset; box-sizing:border-box; display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    padding:14px 16px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border); cursor:pointer;
    transition:border-color .12s, background .12s, transform .12s;}
  .role-btn:hover{background:var(--surface-3); border-color:var(--primary); transform:translateY(-1px);}
  .role-btn:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  .role-icn{flex:0 0 auto; width:34px; height:34px; border-radius:10px; background:var(--primary-tint); color:var(--primary);
    display:flex; align-items:center; justify-content:center;}
  .role-icn svg{width:19px; height:19px;}
  .role-txt{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .role-title{font-weight:700; font-size:14.5px; color:var(--text);}
  .role-desc{font-size:11.5px; color:var(--text-muted); line-height:1.4;}
  .login-passbox{display:flex; flex-direction:column; gap:10px; text-align:left; margin-top:4px;}
  .login-back{all:unset; cursor:pointer; font-size:12px; color:var(--text-muted); font-weight:600; align-self:flex-start; margin-bottom:4px;}
  .login-back:hover{color:var(--primary);}
  .login-passrole{font-weight:800; font-size:15.5px; color:var(--text); margin-bottom:2px;}
  .login-passbox label{font-size:12px; font-weight:700; color:var(--text-muted);}
  .login-passbox input{padding:11px 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:14px;}
  .login-passbox input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .login-error{font-size:12px; color:var(--rag-red); font-weight:600;}
  .login-submit{width:100%; margin-top:4px;}
  .login-note{font-size:11px; color:var(--text-faint); margin:22px 0 0; line-height:1.5;}
  .role-shake{animation:roleShake .32s;}
  @keyframes roleShake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}

  /* Botón de "cambiar de rol" en el pie del sidebar (las 3 vistas). */
  .switchrole-btn{all:unset; box-sizing:border-box; display:flex; align-items:center; gap:6px; cursor:pointer;
    font-size:11.5px; font-weight:700; color:var(--text-muted); padding:8px 0 0;}
  .switchrole-btn:hover{color:var(--accent);}

  /* =====================================================================
     PMO — 8 dominios de desempeño (PMBOK 7)
  ===================================================================== */
  .domain-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .domain-card{all:unset; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; padding:18px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px; cursor:pointer; text-align:left;
    transition:border-color .12s, background .12s;}
  .domain-card:hover{border-color:var(--primary); background:var(--surface-3);}
  .domain-num{font-family:'JetBrains Mono'; font-size:11px; color:var(--text-faint); font-weight:600;}
  .domain-name{font-weight:800; font-size:15px; color:var(--text); font-family:'Manrope',sans-serif;}
  .domain-desc{font-size:12px; color:var(--text-muted); line-height:1.5; flex:1;}
  .domain-status{align-self:flex-start; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;}
  .domain-status.pending{background:var(--rag-gray-tint); color:var(--text-muted);}
  .domain-status.live{background:var(--rag-green-tint); color:var(--rag-green);}
  .domain-detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .domain-sources{font-size:11px; color:var(--text-faint); margin-top:10px;}
  .domain-sources a{color:var(--text-muted);}
  .model-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .model-item{padding:12px 14px; background:var(--surface-2); border:1px dashed var(--border); border-radius:11px;}
  .model-item b{font-size:13px; color:var(--text);}
  .model-item p{margin:4px 0 0; font-size:12px; color:var(--text-muted); line-height:1.5;}
  .pending-box{padding:22px; text-align:center; background:var(--surface-2); border:1px dashed var(--border); border-radius:13px; color:var(--text-muted); font-size:13px; line-height:1.6;}

  /* =====================================================================
     EDT gráfico (árbol de fases → tareas), a partir del export de ClickUp
  ===================================================================== */
  .edttree{display:flex; flex-direction:column; gap:10px;}
  .edttree-phase{border:1px solid var(--border); border-radius:13px; background:var(--surface-2); overflow:hidden;}
  .edttree-phase > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .edttree-phase > summary::-webkit-details-marker{display:none;}
  .edttree-phase > summary .arrow{transition:transform .15s; color:var(--text-faint); flex:0 0 auto;}
  .edttree-phase[open] > summary .arrow{transform:rotate(90deg);}
  .edttree-phase-name{font-weight:700; font-size:13.5px; color:var(--text); flex:1;}
  .edttree-phase-meta{font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono';}
  .edttree-body{padding:0 14px 14px 40px; display:flex; flex-direction:column; gap:7px;}
  .edttree-task{display:grid; grid-template-columns:1fr auto 70px; gap:10px; align-items:center; padding:7px 10px;
    background:var(--surface); border-radius:9px; font-size:12.5px;}
  .edttree-task .tname{color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .edttree-task .tdot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; flex:0 0 auto;}

  /* =====================================================================
     Gantt interactivo embebido (adjunto de Jorge — export de ClickUp).
     Paleta prefijada "ig-" reutilizando las variables RAG del dashboard.
  ===================================================================== */
  .ig-wrap{--ig-label-w:230px; --ig-timeline-w:1200px;}
  .ig-stats{display:flex; gap:16px; flex-wrap:wrap; margin:2px 0 14px;}
  .ig-stat .n{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text);}
  .ig-stat .l{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
  .ig-controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .ig-search{flex:1 1 200px; min-width:160px; position:relative;}
  .ig-search input{width:100%; padding:7px 10px 7px 28px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:13px;}
  .ig-search input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .ig-search svg{position:absolute; left:8px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none; color:var(--text-muted);}
  .ig-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .ig-chip{border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:11.5px;
    padding:5px 10px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .ig-chip[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:#06282c;}
  .ig-btns{display:flex; gap:6px;}
  .ig-btn{border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:11.5px; padding:6px 10px;
    border-radius:7px; cursor:pointer;}
  .ig-btn:hover{background:var(--surface-3);}
  .ig-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--text-muted); margin-bottom:10px;}
  .ig-legend span{display:inline-flex; align-items:center; gap:5px;}
  .ig-sw{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .ig-sw.diamond{width:9px; height:9px; border-radius:2px; transform:rotate(45deg);}
  .ig-gantt-wrap{border:1px solid var(--border); border-radius:10px; background:var(--surface-2); overflow:hidden;}
  .ig-gantt-scroll{overflow:auto; max-height:64vh;}
  .ig-grid{display:grid; grid-template-columns:var(--ig-label-w) var(--ig-timeline-w); position:relative;}
  .ig-today-line{position:absolute; top:38px; bottom:0; width:2px; background:var(--rag-red); z-index:6; pointer-events:none;
    box-shadow:0 0 5px rgba(0,0,0,.35);}
  .ig-cell{border-bottom:1px solid var(--border-soft); display:flex; align-items:center; height:30px; min-width:0;}
  .ig-label{position:sticky; left:0; z-index:2; background:var(--surface-2); border-right:1px solid var(--border); padding-right:8px; cursor:pointer;}
  .ig-label:hover{background:var(--surface-3);}
  .ig-label-inner{display:flex; align-items:center; gap:6px; width:100%; min-width:0; overflow:hidden;}
  .ig-chev{width:12px; height:12px; flex:0 0 auto; color:var(--text-faint); transition:transform .12s; cursor:pointer;}
  .ig-chev.open{transform:rotate(90deg);}
  .ig-chev.leaf{visibility:hidden;}
  .ig-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .ig-name{font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);}
  .ig-name.tarea{font-weight:700;}
  .ig-est-flag{color:var(--rag-amber); font-weight:700; cursor:help;}
  .ig-pct{font-size:10.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; flex:0 0 auto; margin-left:auto; padding-left:4px;}
  .ig-head-row .ig-cell{height:38px; font-size:10.5px; color:var(--text-faint);}
  .ig-head-label{position:sticky; left:0; top:0; z-index:4; background:var(--surface-2); border-right:1px solid var(--border);
    font-size:10.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding-left:10px;}
  .ig-head-timeline{position:sticky; top:0; z-index:3; background:var(--surface-2); height:38px; overflow:hidden;}
  .ig-month{position:absolute; top:0; bottom:0; border-left:1px solid var(--border-soft); display:flex; align-items:center;
    padding-left:6px; font-size:10.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden;}
  .ig-today-flag{position:absolute; top:2px; transform:translateX(-50%); font-size:9.5px; font-weight:700; color:var(--rag-red);
    background:var(--surface-2); padding:0 4px; white-space:nowrap;}
  .ig-track{position:relative; height:30px;}
  .ig-bar{position:absolute; top:6px; height:18px; border-radius:5px; overflow:hidden; cursor:pointer;}
  .ig-bar .ig-fill{position:absolute; left:0; top:0; bottom:0;}
  .ig-bar-label{position:absolute; left:100%; top:0; bottom:0; display:flex; align-items:center; margin-left:6px;
    font-size:10.5px; color:var(--text-muted); white-space:nowrap; pointer-events:none;}
  .ig-milestone{position:absolute; top:8px; width:14px; height:14px; transform:translateX(-50%) rotate(45deg); border-radius:3px;
    border:2px solid var(--surface-2); cursor:pointer;}
  .ig-no-dates{font-size:10.5px; color:var(--text-faint); padding-left:10px; font-style:italic;}
  .ig-row.dim .ig-name{opacity:.4;}
  .ig-row.dim .ig-bar,.ig-row.dim .ig-milestone{opacity:.35;}
  .ig-tooltip{position:fixed; pointer-events:none; background:var(--bg-2); color:var(--text); font-size:12px; line-height:1.5;
    border-radius:8px; padding:8px 10px; max-width:260px; z-index:150; box-shadow:0 6px 18px rgba(0,0,0,.35); opacity:0;
    transition:opacity .08s; border:1px solid var(--border);}
  .ig-tooltip b{display:block; font-weight:700; margin-bottom:3px;}
  .ig-tooltip .ig-tt-row{opacity:.85;}
  .ig-tooltip.show{opacity:1;}
  .ig-empty-msg{padding:24px; text-align:center; color:var(--text-faint); font-size:13px;}
  .ig-modal-backdrop{position:fixed; inset:0; background:rgba(4,20,22,.55); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:160; opacity:0; pointer-events:none; transition:opacity .14s;}
  .ig-modal-backdrop.show{opacity:1; pointer-events:auto;}
  .ig-modal-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; max-width:440px; width:100%;
    max-height:85vh; overflow:auto; padding:22px 22px 20px; position:relative; box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .ig-modal-close{position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .ig-modal-close:hover{background:var(--surface-3); color:var(--text);}
  .ig-modal-breadcrumb{font-size:11px; color:var(--text-faint); margin:0 32px 6px 0;}
  .ig-modal-title{font-size:16.5px; font-weight:800; margin:0 32px 12px 0; line-height:1.3; color:var(--text); font-family:'Manrope',sans-serif;}
  .ig-modal-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .ig-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);}
  .ig-badge .ig-dot{width:7px; height:7px; border-radius:50%;}
  .ig-badge.est{color:var(--rag-amber); border-color:var(--rag-amber);}
  .ig-modal-progress-track{height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; margin-bottom:4px;}
  .ig-modal-progress-fill{height:100%; border-radius:5px;}
  .ig-modal-progress-label{font-size:11px; color:var(--text-faint); margin-bottom:14px; font-variant-numeric:tabular-nums;}
  .ig-modal-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--border-soft);}
  .ig-modal-meta .ig-mi-l{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;}
  .ig-modal-meta .ig-mi-v{font-size:12.5px; color:var(--text); font-variant-numeric:tabular-nums;}
  .ig-modal-section-title{font-size:10.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
  .ig-modal-people{display:flex; flex-direction:column; gap:8px;}
  .ig-person{display:flex; align-items:center; gap:10px;}
  .ig-person .ig-av{width:28px; height:28px; border-radius:50%; background:var(--primary); color:#06282c; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .ig-person .ig-pname{font-size:12.5px; color:var(--text);}
  .ig-person .ig-pcount{font-size:10.5px; color:var(--text-faint); margin-left:auto; flex:0 0 auto;}
  .ig-modal-people .ig-none{font-size:12.5px; color:var(--text-faint); font-style:italic;}
  @media (max-width:640px){
    .ig-modal-meta{grid-template-columns:1fr 1fr;}
    .domain-grid{grid-template-columns:1fr;}
  }

   vuelve sola a la pantalla de login. No es una medida de seguridad real
   (las contraseñas son un filtro simple, ver arriba); sirve para que un
   tablero abierto en una pantalla compartida (p.ej. en una sala del
   Comité) no quede expuesto indefinidamente.

const IDLE_TIMEOUT_MS = 2*60*1000;
let idleTimer = null;
function resetIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(!STATE.role) return; // nada que cerrar si ya está en el login
  idleTimer = setTimeout(()=>{ if(STATE.role) showLogin(true); }, IDLE_TIMEOUT_MS);
}
["mousemove","mousedown","keydown","scroll","touchstart","click","input"].forEach(evt=>{
  document.addEventListener(evt, resetIdleTimer, {passive:true});
});

const clone = (x) => JSON.parse(JSON.stringify(x));
const uid = () => Math.random().toString(36).slice(2,10);

async function initData(){
  let db = null;
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  STATE.db = db;

  if(!db){
    STATE.offline = true;
    STATE.config = clone(SEED.config);
    for(const k in SEED.collections) {}
    Object.keys(STATE.collections).forEach(k=>{
      STATE.collections[k] = (SEED[k]||[]).map((d,i)=>({id:"seed-"+k+"-"+i, ...clone(d)}));
    });
    STATE.ready = true;
    render();
    return;
  }

  // Sonda de permisos: sólo quienes tienen acceso "admin" (compartido como
  // editor) pueden escribir. No hay capability "user" disponible en esta
  // sesión para consultarlo directamente, así que se infiere intentando
  // una escritura inocua y observando si el store la rechaza.
  try{
    await db.doc("meta/_permcheck").set({ ts: Date.now() });
    STATE.isAdmin = true;
  }catch(e){
    STATE.isAdmin = (e && e.code) ? false : false;
  }

  // Sembrado inicial si la base está vacía (sólo si hay permisos de escritura).
  const cfgSnap = await db.doc("meta/config").get();
  if(!cfgSnap.exists && STATE.isAdmin){
    try{
      await db.doc("meta/config").set(SEED.config);
      for(const col of Object.keys(SEED)){
        if(col==="config") continue;
        for(const item of SEED[col]) await db.collection(col).add(item);
      }
      toast("Base de datos inicializada con la información del Kick Off y el Acta 31/08.");
    }catch(e){ /* alguien más ya sembró en paralelo — se ignora */ }
  }

  // Config: doc único con snapshot en vivo.
  db.doc("meta/config").onSnapshot(snap=>{
    STATE.config = snap.exists ? snap.data() : clone(SEED.config);
    STATE.ready = true;
    render();
  }, err=>{ console.error(err); });

  // Colecciones: snapshot en vivo.
  Object.keys(STATE.collections).forEach(col=>{
    db.collection(col).onSnapshot(qs=>{
      // El id real del documento (d.id) siempre gana sobre un eventual campo
      // "id" guardado dentro de los datos (p. ej. registros del sembrado
      // inicial, que traían su propio "id" como dato) — si no, Editar/
      // Eliminar apuntarían a un documento equivocado.
      STATE.collections[col] = qs.docs.map(d=>({...d.data(), id:d.id}));
      render();
    }, err=>{ console.error(col, err); });
  });
}

    if(id) await STATE.db.collection(col).doc(id).set(data);

/* ---------------------------------------------------------------------
   REGISTRO DE EDICIONES (auditoría) — cada alta/edición/eliminación hecha
   desde el backoffice (incluida la configuración general) queda registrada
   con quién, cuándo, y qué campos cambiaron. Se guarda en su propia
   colección ("auditoria"), visible en el backoffice en modo solo lectura.
--------------------------------------------------------------------- */
function diffFields(before, after){
  const out = [];
  const keys = new Set([...Object.keys(before||{}), ...Object.keys(after||{})]);
  keys.forEach(k=>{
    if(k==="id") return;
    const a = before ? before[k] : undefined;
    const b = after ? after[k] : undefined;
    const av = JSON.stringify(a===undefined?null:a);
    const bv = JSON.stringify(b===undefined?null:b);
    if(av !== bv) out.push({ campo:k, anterior:(a===undefined||a===null||a==="")?"—":a, nuevo:(b===undefined||b===null||b==="")?"—":b });
  });
  return out;
}
function diffFieldsPartial(before, patch){
  const out = [];
  Object.keys(patch||{}).forEach(k=>{
    if(k==="fechaActualizacion") return;
    const a = before ? before[k] : undefined;
    const b = patch[k];
    const av = JSON.stringify(a===undefined?null:a);
    const bv = JSON.stringify(b===undefined?null:b);
    if(av !== bv) out.push({ campo:k, anterior:(a===undefined||a===null||a==="")?"—":a, nuevo:(b===undefined||b===null||b==="")?"—":b });
  });
  return out;
}
async function logAudit(tipo, col, id, cambios){
  if(!STATE.db || col==="auditoria" || !cambios || !cambios.length) return;
  try{
    await STATE.db.collection("auditoria").add({
      fecha: new Date().toISOString(),
      coleccion: col,
      docId: id || null,
      tipo,
      cambios,
      usuario: (typeof ROLE_LABELS!=="undefined" && ROLE_LABELS[STATE.role]) || STATE.role || "—"
    });
  }catch(e){ /* un fallo al auditar no debe interrumpir el guardado principal */ }
}

/* Aviso de "dato desactualizado" — los KPIs ejecutivos (avance físico,
   desviación de cronograma) son overrides que confirma el PM, no un
   cálculo automático; nunca se recalculan solos. Lo único que sí es
   automático es avisar cuando pasó mucho tiempo desde la última vez que
   el PM los confirmó, para que sepa que conviene revisarlos en Backoffice
   contra el avance real del cronograma. */
function diasDesdeActualizacion(fechaISO){
  if(!fechaISO) return null;
  return daysBetween(fechaISO, todayISO());
}
function staleBadgeHTML(fechaISO, umbral){
  const dias = diasDesdeActualizacion(fechaISO);
  if(dias===null || dias<(umbral||7)) return "";
  return `<span class="chip amarillo" title="Los KPIs ejecutivos (avance físico, desviación de cronograma) no se recalculan solos — hace ${dias} días que no se confirman contra el avance real del cronograma. Revisar en Backoffice → Configuración general." style="margin-left:8px;">⚠ Revisar avance — hace ${dias} días</span>`;
}
const todayISO = () => new Date().toISOString().slice(0,10);

function toast(msg, isErr){

/* Clasificación de riesgos en 4 niveles (Crítico/Alto/Medio/Bajo) sobre

}

function ganttRange(){
  const dates=[];
  STATE.collections.gantt.forEach(t=>{ if(t.inicioPlan) dates.push(t.inicioPlan); if(t.finPlan) dates.push(t.finPlan); });
  STATE.collections.hitos.forEach(h=>{ if(h.fecha) dates.push(h.fecha); });
  if(!dates.length) return {start:new Date("2026-06-01"), end:new Date("2027-08-01")};
  const start = new Date(Math.min(...dates.map(d=>+new Date(d))));
  const end = new Date(Math.max(...dates.map(d=>+new Date(d))));
  start.setDate(1);
  end.setMonth(end.getMonth()+1, 1);
  return {start, end};
}
function monthsBetween(start,end){
  const out=[]; let d=new Date(start);
  while(d<end){ out.push(new Date(d)); d.setMonth(d.getMonth()+1); }
  return out;
}
function pctOfRange(date, start, end){
  return Math.max(0, Math.min(100, ((new Date(date)-start)/(end-start))*100));
}

/* Ruta crítica (aproximada) — el cronograma no trae dependencias explícitas
   entre actividades (ver Supuestos en Backoffice → Config), así que se
   aproxima la ruta crítica encadenando, desde la última actividad hacia
   atrás, la tarea predecesora cuyo fin queda más pegado (≤3 días de holgura)
   al inicio de la actividad actual. Donde ese encadenamiento se corta hay
   holgura real (float) y esa tarea queda fuera de la ruta crítica. */
function computeCriticalPath(tasks){
  const CP_TOLERANCIA_DIAS = 3;
  const withDates = tasks.filter(t=>t.inicioPlan && t.finPlan);
  const critical = new Set();
  if(!withDates.length) return critical;
  const sorted = [...withDates].sort((a,b)=>new Date(a.finPlan)-new Date(b.finPlan));
  let current = sorted[sorted.length-1];
  critical.add(current);
  while(true){
    const candidatos = sorted.filter(t=>t!==current && new Date(t.finPlan)<=new Date(current.inicioPlan));
    if(!candidatos.length) break;
    candidatos.sort((a,b)=>new Date(b.finPlan)-new Date(a.finPlan));
    const pred = candidatos[0];
    if(daysBetween(pred.finPlan, current.inicioPlan) > CP_TOLERANCIA_DIAS) break;
    critical.add(pred);
    current = pred;
  }
  return critical;
}

/* ---------------------------------------------------------------------
   EVM simplificado (curva S, SPI) — a partir del % de avance de cada
   tarea del Gantt, sin histórico de snapshots (ver supuestos). El CPI se
   retiró como métrica de la plataforma a pedido del PM.
--------------------------------------------------------------------- */
function computeSCurve(tasks){
  const withDates = (tasks||[]).filter(t=>t.inicioPlan && t.finPlan);
  if(!withDates.length) return null;
  const start = new Date(Math.min(...withDates.map(t=>+new Date(t.inicioPlan))));
  const end = new Date(Math.max(...withDates.map(t=>+new Date(t.finPlan))));
  const monthStart = new Date(start.getFullYear(), start.getMonth(), 1);
  const monthEndExcl = new Date(end.getFullYear(), end.getMonth()+1, 1);
  const months = monthsBetween(monthStart, monthEndExcl);
  const weight = 1/withDates.length;
  const fracAt = (t, at) => {
    const s=new Date(t.inicioPlan), e=new Date(t.finPlan);
    if(at<=s) return 0; if(at>=e) return 1; return (at-s)/(e-s);
  };
  const planCum = months.map(m=>{
    const checkpoint = new Date(m.getFullYear(), m.getMonth()+1, 0);
    return withDates.reduce((sum,t)=>sum + fracAt(t,checkpoint)*weight, 0) * 100;
  });
  const today = new Date();
  const realPct = withDates.reduce((sum,t)=>sum + ((t.avance||0)/100)*weight, 0) * 100;
  const planTodayPct = withDates.reduce((sum,t)=>sum + fracAt(t,today)*weight, 0) * 100;
  return {months, planCum, start, end, realPct, planTodayPct, n:withDates.length};
}
function computeSPI(scurve){
  if(!scurve || scurve.planTodayPct<0.5) return null;
  return scurve.realPct/scurve.planTodayPct;
}
// El promedio simple sin ponderar de computeSCurve() (misma limitación que
// avanceGeneral, ver supuestos EVM) sobreestima mucho el "planificado a
// hoy" cuando el Gantt mezcla fases de meses con subtareas de 1 día. Por
// eso el punto "real" ya se sobreescribe con el avance físico confirmado
// por el PM (avanceFisicoPct); aquí además se reescala toda la curva
// planificada para que su valor a la fecha de corte coincida con
// avancePlanificadoPct (otro override de PM: "qué tanto deberíamos haber
// avanzado según el plan"), preservando la forma de la curva S. Si ese
// campo no está definido, se deja el cálculo automático sin tocar.
function applyScheduleOverrides(scurve, c, avanceGeneral){
  if(!scurve) return scurve;
  scurve.realPct = avanceGeneral;
  const planTarget = (c.avancePlanificadoPct!=null) ? c.avancePlanificadoPct : null;
  const n = scurve.months.length;
  if(planTarget!=null && n>1){
    // Punto de corte "hoy" en el mismo eje fraccional (0..1) que usa el
    // trazo real en svgSCurve, para que el reescalado quede alineado con
    // dónde cae el punto real en el dibujo.
    const totalMs = scurve.end - scurve.start;
    const todayFrac = totalMs>0 ? Math.min(Math.max((new Date()-scurve.start)/totalMs,0),1) : 0;
    const todayIdx = todayFrac*(n-1);
    const i0 = Math.floor(todayIdx), i1 = Math.min(i0+1, n-1), f = todayIdx-i0;
    const rawToday = scurve.planCum[i0] + (scurve.planCum[i1]-scurve.planCum[i0])*f;
    // Tramo ya transcurrido: se reescala proporcionalmente para que el
    // valor "a hoy" coincida con planTarget (el override del PM), sin
    // tocar la forma relativa entre esos meses.
    // Tramo futuro: se remapea linealmente de [rawToday,100] a
    // [planTarget,100] para que la curva siga llegando a 100% en la
    // fecha de cierre, conservando la curvatura original del tramo.
    scurve.planCum = scurve.planCum.map((p,i)=>{
      if(i<=todayIdx){
        return rawToday>0.01 ? Math.min(100, p*(planTarget/rawToday)) : planTarget;
      }
      const denom = 100-rawToday;
      return denom>0.01 ? Math.min(100, planTarget + (100-planTarget)*((p-rawToday)/denom)) : 100;
    });
    scurve.planTodayPct = planTarget;
  }
  return scurve;
}
function metricPill(label, value, isGood){
  if(value===null||value===undefined||isNaN(value)) return `<span class="metricpill na"><span class="mlabel">${label}</span>s/d</span>`;
  const cls = isGood===null?'':(isGood?'good':'bad');
  return `<span class="metricpill ${cls}"><span class="mlabel">${label}</span>${value.toFixed(2)}</span>`;
}

/* ---------------------------------------------------------------------
   Mini-gráficos SVG (sin librerías) para tarjetas y casillas del EDT.
--------------------------------------------------------------------- */
function svgRing(pct, color, size, stroke){
  size = size||40; stroke = stroke||5;
  const r=(size-stroke)/2, c=2*Math.PI*r, p=Math.min(Math.max(pct||0,0),100), off=c*(1-p/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
function svgStackBar(counts, colors, w, h){
  w=w||140; h=h||10;
  const total = counts.reduce((a,b)=>a+b,0)||1;
  let x=0;
  const rects = counts.map((v,i)=>{
    const width=(v/total)*w;
    const r = v>0 ? `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(width,0).toFixed(1)}" height="${h}" fill="${colors[i]}"/>` : "";
    x+=width; return r;
  }).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="border-radius:4px; overflow:hidden; display:block;"><rect width="${w}" height="${h}" fill="var(--surface-3)"/>${rects}</svg>`;
}
function svgGauge(pctElapsed, w, h){
  w=w||140; h=h||8;
  const p = Math.min(Math.max(pctElapsed||0,0),100);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="0" y="0" width="${w}" height="${h}" rx="${h/2}" fill="var(--surface-3)"/><rect x="0" y="0" width="${(p/100*w).toFixed(1)}" height="${h}" rx="${h/2}" fill="var(--accent)"/></svg>`;
}
function svgSCurve(scurve, opts){
  opts = opts||{}; const w=opts.w||180, h=opts.h||52, big=!!opts.big, pad=big?28:4;
  if(!scurve || scurve.months.length<2){
    return `<div class="hint" style="font-size:11.5px;">Fechas insuficientes en el Gantt para trazar la curva S.</div>`;
  }
  const n = scurve.months.length;
  const xAt = (i) => pad + (i/(n-1))*(w-2*pad);
  const yAt = (pct) => (h-pad) - (Math.min(pct,100)/100)*(h-2*pad);
  const planPath = scurve.planCum.map((p,i)=>`${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(p).toFixed(1)}`).join(" ");
  const totalMs = scurve.end - scurve.start;
  const todayMs = Math.min(Math.max(new Date()-scurve.start,0), totalMs);
  const todayX = pad + (totalMs>0?(todayMs/totalMs):0)*(w-2*pad);
  const todayYReal = yAt(scurve.realPct);
  const realPath = `M${pad.toFixed(1)},${yAt(0).toFixed(1)} L${todayX.toFixed(1)},${todayYReal.toFixed(1)}`;
  const grid = big ? [0,25,50,75,100].map(p=>`<line x1="${pad}" y1="${yAt(p).toFixed(1)}" x2="${w-pad}" y2="${yAt(p).toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/><text x="${pad-6}" y="${(yAt(p)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)">${p}%</text>`).join("") : "";
  const monthLabels = big ? scurve.months.filter((_,i)=>i%Math.ceil(n/8||1)===0).map(m=>{
    const i = scurve.months.indexOf(m);
    return `<text x="${xAt(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${m.toLocaleDateString('es-BO',{month:'short',year:'2-digit'})}</text>`;
  }).join("") : "";
  return `<svg class="scurve-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;">
    ${grid}
    <line x1="${pad}" y1="${(h-pad).toFixed(1)}" x2="${w-pad}" y2="${(h-pad).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <path d="${planPath}" fill="none" stroke="var(--text-faint)" stroke-width="${big?2:1.6}" stroke-dasharray="4 3"/>
    <path d="${realPath}" fill="none" stroke="var(--accent)" stroke-width="${big?2.4:2}"/>
    <circle cx="${todayX.toFixed(1)}" cy="${todayYReal.toFixed(1)}" r="${big?4:2.6}" fill="var(--accent)"/>
    ${monthLabels}
  </svg>`;
}

  const riesgosMaterializados = STATE.collections.riesgos.filter(r=>r.estado==="materializado").sort((a,b)=>riskLevel(b.probabilidad,b.impacto).score-riskLevel(a.probabilidad,a.impacto).score);
  const riesgosTop = riesgosMaterializados.length ? riesgosMaterializados : STATE.collections.riesgos.filter(r=>r.esTop || riskLevel(r.probabilidad,r.impacto).tier==="critico");
  const problemasAbiertos = STATE.collections.problemas.filter(p=>p.estado!=="resuelto");
  const problemasFlagged = STATE.collections.problemas.filter(p=>p.alertaRoja);
  const decisionesPend = STATE.collections.decisiones.filter(d=>d.estado==="pendiente").sort((a,b)=>(a.prioridad??99)-(b.prioridad??99));
  const hitosOrdenados = [...STATE.collections.hitos].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const proximoHito = hitosOrdenados.find(h=>new Date(h.fecha)>=new Date(todayISO())) || hitosOrdenados[hitosOrdenados.length-1];
  const goLive = c.fechaEntregaFinal;
  const diasGoLive = goLive ? daysBetween(todayISO(), goLive) : null;
  const avanceGeneral = (c.avanceFisicoPct!=null) ? c.avanceFisicoPct : (STATE.collections.gantt.length ? Math.round(STATE.collections.gantt.reduce((s,t)=>s+(t.avance||0),0)/STATE.collections.gantt.length) : 0);
  const scurveGlobal = computeSCurve(STATE.collections.gantt);
  applyScheduleOverrides(scurveGlobal, c, avanceGeneral);
  const riskCounts4 = RISK_TIERS.map(t=>riesgosOrdenados.filter(r=>riskLevel(r.probabilidad,r.impacto).tier===t.key).length);

      </button>
      <button class="card kpi" data-route="cronograma" style="${kpiStyle("var(--primary)", "linear-gradient(135deg, var(--tint-primary-soft), var(--surface-2))")}">

function tecStatusVar(n){
  const overdue = n.due && n.status!=="complete" && new Date(n.due+"T00:00:00") < new Date(todayISO()+"T00:00:00");
  if(overdue) return "--rag-red";
  if(n.status==="complete") return "--rag-green";
  if(n.status==="in progress") return "--rag-amber";
  return "--rag-gray";
}
function edtNodeHTML(n, level){
  level = level||0;
  const pct = Math.max(0, Math.min(100, Math.round(n.pct||0)));
  if(!n.children || !n.children.length){
    return `<div class="edttree-task"><span class="tname"><span class="tdot" style="background:var(${tecStatusVar(n)})"></span>${n.name}${n.mile?' ◆':''}</span><span style="color:var(--text-faint);">${fmtDate(n.start)} – ${fmtDate(n.due)}</span><span>${pct}%</span></div>`;
  }
  return `<details class="edttree-phase"${level<1?' open':''}>
    <summary><svg class="arrow" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 6 15 12 9 18"/></svg>
      <span class="edttree-phase-name">${n.name}</span>
      <span class="edttree-phase-meta">${n.children.length} tarea${n.children.length===1?'':'s'} · ${pct}%</span>
    </summary>
    <div class="edttree-body">${n.children.map(c=>edtNodeHTML(c, level+1)).join('')}</div>
  </details>`;
}
