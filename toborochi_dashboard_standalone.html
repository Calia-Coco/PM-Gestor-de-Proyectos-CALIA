function mountInteractiveGantt(id){
  const root = document.getElementById(id+"-wrap");
  if(!root) return; // la vista actual no incluye este Gantt

  const PX_PER_DAY = 3.4, LABEL_W = 230, ROW_H = 30;
  const MONTHS_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const TODAY = todayISO();
  const $ = (suffix)=>document.getElementById(id+"-"+suffix);

  function toDate(s){ return new Date(s+'T00:00:00Z'); }
  function dayNum(s){ return Math.floor(toDate(s).getTime()/86400000); }
  function fmtD(s){ if(!s) return '—'; const d=toDate(s); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }

  let minDay=Infinity, maxDay=-Infinity;
  (function walk(nodes){ nodes.forEach(n=>{ if(n.start) minDay=Math.min(minDay,dayNum(n.start)); if(n.due) maxDay=Math.max(maxDay,dayNum(n.due)); walk(n.children); }); })(TREE_TECNICO);
  minDay-=5; maxDay+=5;
  const totalDays = maxDay-minDay;
  const TIMELINE_W = Math.max(600, Math.round(totalDays*PX_PER_DAY));
  const todayDay = dayNum(TODAY);
  const todayX = (todayDay-minDay)*PX_PER_DAY;
  function xFor(s){ return (dayNum(s)-minDay)*PX_PER_DAY; }

  root.style.setProperty('--ig-label-w', LABEL_W+'px');
  root.style.setProperty('--ig-timeline-w', TIMELINE_W+'px');

  let leafTotal=0, leafDone=0, leafProg=0, leafTodo=0, phases=0, milestones=0;
  (function walk(nodes){ nodes.forEach(n=>{
    if(n.children.length===0){ leafTotal++; if(n.status==='complete') leafDone++; else if(n.status==='in progress') leafProg++; else leafTodo++; }
    if(n.tipo==='Tarea'){ if(n.mile) milestones++; else phases++; }
    walk(n.children);
  }); })(TREE_TECNICO);
  const pctOverall = leafTotal? Math.round(leafDone/leafTotal*100) : 0;
  $("stats").innerHTML = `<div class="ig-stat"><div class="n">${pctOverall}%</div><div class="l">Avance</div></div>
   <div class="ig-stat"><div class="n">${leafDone}</div><div class="l">Completadas</div></div>
   <div class="ig-stat"><div class="n">${leafProg}</div><div class="l">En progreso</div></div>
   <div class="ig-stat"><div class="n">${leafTodo}</div><div class="l">Por hacer</div></div>`;

  const CHIP_DEFS = [['all','Todas'],['todo','Por hacer'],['progress','En progreso'],['complete','Completadas'],['overdue','Atrasadas']];
  let statusFilter='all';
  const chipsEl = $("statusChips");
  chipsEl.innerHTML='';
  CHIP_DEFS.forEach(([key,label])=>{
    const b=document.createElement('button');
    b.className='ig-chip'; b.type='button'; b.textContent=label; b.setAttribute('aria-pressed', key==='all'?'true':'false');
    b.addEventListener('click', ()=>{
      statusFilter=key;
      matchCache.clear(); // los resultados cacheados eran de otro filtro — si no se limpia, los chips no cambian nada
      [...chipsEl.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      renderGrid();
    });
    chipsEl.appendChild(b);
  });

  function isOverdue(n){ return n.due && n.status!=='complete' && dayNum(n.due)<todayDay; }
  function matchesStatus(n){
    if(statusFilter==='all') return true;
    if(statusFilter==='overdue') return isOverdue(n);
    if(statusFilter==='todo') return n.status==='to do';
    if(statusFilter==='progress') return n.status==='in progress';
    if(statusFilter==='complete') return n.status==='complete';
    return true;
  }
  let searchQ='';
  function matchesSearch(n){ if(!searchQ) return true; const q=searchQ.toLowerCase(); return n.name.toLowerCase().includes(q) || (n.resp && n.resp.toLowerCase().includes(q)); }
  function nodeMatches(n){ return matchesStatus(n) && matchesSearch(n); }
  const matchCache = new Map();
  function subtreeHasMatch(n){
    if(matchCache.has(n.id)) return matchCache.get(n.id);
    const r = nodeMatches(n) || n.children.some(subtreeHasMatch);
    matchCache.set(n.id, r);
    return r;
  }
  function statusVar(n){ if(isOverdue(n)) return '--rag-red'; if(n.status==='complete') return '--rag-green'; if(n.status==='in progress') return '--rag-amber'; return '--rag-gray'; }
  function statusFillVar(n){ return statusVar(n)+'-tint'; }
  const STATUS_LABEL = {'to do':'Por hacer','in progress':'En progreso','complete':'Completada'};

  const expanded = new Set();
  const parentIds = [];
  (function walk(nodes){ nodes.forEach(n=>{ if(n.children.length) parentIds.push(n.id); walk(n.children); }); })(TREE_TECNICO);

  $("expandAll").onclick = ()=>{ parentIds.forEach(pid=>expanded.add(pid)); renderGrid(); };
  $("collapseAll").onclick = ()=>{ expanded.clear(); renderGrid(); };
  $("search").oninput = (e)=>{ searchQ=e.target.value.trim(); matchCache.clear(); renderGrid(); };

  const tooltip = $("tooltip");
  function showTip(evt, html){ tooltip.innerHTML=html; tooltip.classList.add('show'); moveTip(evt); }
  function moveTip(evt){
    const pad=14; let x=evt.clientX+pad, y=evt.clientY+pad; const tw=260, th=90;
    if(x+tw>window.innerWidth) x=evt.clientX-tw-pad;
    if(y+th>window.innerHeight) y=evt.clientY-th-pad;
    tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
  }
  function hideTip(){ tooltip.classList.remove('show'); }
  function tipHTML(n){
    const dur=(n.start&&n.due)?(dayNum(n.due)-dayNum(n.start)+1):null;
    let rows = `<div class="ig-tt-row">${STATUS_LABEL[n.status]||n.status}${isOverdue(n)?' · Atrasada':''}</div>`;
    rows += `<div class="ig-tt-row">${fmtD(n.start)} – ${fmtD(n.due)}${dur?' · '+dur+' día'+(dur===1?'':'s'):''}</div>`;
    rows += `<div class="ig-tt-row">Avance: ${Math.max(0,Math.min(100,Math.round(n.pct||0)))}%</div>`;
    if(n.resp) rows += `<div class="ig-tt-row">${n.resp.replace(/\n/g, ', ')}</div>`;
    if(n.est) rows += `<div class="ig-tt-row" style="color:var(--rag-amber)">⚠ Fecha estimada — calculada a partir de la fase</div>`;
    return `<b>${n.name}</b>${rows}`;
  }

  const modalBackdrop = $("modalBackdrop");
  const modalCard = $("modalCard");
  let lastFocused=null;
  function parsePeople(resp){ if(!resp) return []; return resp.split(/[\n\/]+/).map(s=>s.trim()).filter(Boolean); }
  function initials(name){ const parts=name.split(/\s+/).filter(Boolean); if(parts.length===1) return parts[0].slice(0,2).toUpperCase(); return (parts[0][0]+parts[parts.length-1][0]).toUpperCase(); }
  function aggregatePeople(node){
    const counts=new Map();
    (function walk(n){ parsePeople(n.resp).forEach(p=>counts.set(p,(counts.get(p)||0)+1)); n.children.forEach(walk); })(node);
    return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  }
  function openModal(n, path){
    lastFocused=document.activeElement;
    const nPct=Math.max(0,Math.min(100,Math.round(n.pct||0)));
    $("modalBreadcrumb").textContent = path && path.length ? path.join(' › ') : (n.tipo==='Tarea' && !path.length ? 'Fase de nivel superior' : '');
    $("modalTitle").textContent = n.name;
    const badges=[];
    badges.push(`<span class="ig-badge"><span class="ig-dot" style="background:var(${statusVar(n)})"></span>${STATUS_LABEL[n.status]||n.status}</span>`);
    if(isOverdue(n)) badges.push(`<span class="ig-badge" style="color:var(--rag-red);border-color:var(--rag-red)">Atrasada</span>`);
    if(n.mile) badges.push(`<span class="ig-badge">◆ Hito</span>`);
    if(n.children.length) badges.push(`<span class="ig-badge">${n.children.length} subtarea${n.children.length===1?'':'s'}</span>`);
    if(n.est) badges.push(`<span class="ig-badge est">~ Fecha estimada</span>`);
    $("modalBadges").innerHTML = badges.join('');
    $("modalProgressFill").style.width = nPct+'%';
    $("modalProgressFill").style.background = `var(${statusVar(n)})`;
    $("modalProgressLabel").textContent = 'Avance: '+nPct+'%';
    const dur=(n.start&&n.due)?(dayNum(n.due)-dayNum(n.start)+1):null;
    const metaItems=[['Inicio',fmtD(n.start)],['Fin',fmtD(n.due)],['Duración', dur?(dur+' día'+(dur===1?'':'s')):'—'],['Fase', path&&path.length?path[path.length-1]:'—']];
    $("modalMeta").innerHTML = metaItems.map(([l,v])=>`<div><div class="ig-mi-l">${l}</div><div class="ig-mi-v">${v}</div></div>`).join('');
    const peopleEl=$("modalPeople"), titleEl=$("modalPeopleTitle");
    const direct=parsePeople(n.resp);
    if(direct.length){
      titleEl.textContent='Asignado a';
      peopleEl.innerHTML = direct.map(p=>`<div class="ig-person"><span class="ig-av">${initials(p)}</span><span class="ig-pname">${p}</span></div>`).join('');
    } else if(n.children.length){
      const agg=aggregatePeople(n);
      if(agg.length){
        titleEl.textContent = `Equipo involucrado (${agg.length}, agregado de las subtareas)`;
        peopleEl.innerHTML = agg.map(([p,c])=>`<div class="ig-person"><span class="ig-av">${initials(p)}</span><span class="ig-pname">${p}</span><span class="ig-pcount">${c} tarea${c===1?'':'s'}</span></div>`).join('');
      } else { titleEl.textContent='Asignado a'; peopleEl.innerHTML=`<div class="ig-none">Sin responsables asignados en esta fase</div>`; }
    } else { titleEl.textContent='Asignado a'; peopleEl.innerHTML=`<div class="ig-none">Sin responsable asignado</div>`; }
    modalBackdrop.classList.add('show');
    $("modalClose").focus();
    document.addEventListener('keydown', onModalKeydown);
  }
  function closeModal(){ modalBackdrop.classList.remove('show'); document.removeEventListener('keydown', onModalKeydown); if(lastFocused && lastFocused.focus) lastFocused.focus(); }
  function onModalKeydown(e){ if(e.key==='Escape') closeModal(); }
  $("modalClose").onclick = closeModal;
  modalBackdrop.onclick = (e)=>{ if(e.target===modalBackdrop) closeModal(); };
  modalCard.onclick = (e)=>e.stopPropagation();

  function buildMonthHeader(){
    const wrap=document.createElement('div');
    wrap.className='ig-head-timeline';
    wrap.style.width=TIMELINE_W+'px';
    let d=new Date(minDay*86400000); d.setUTCDate(1);
    while(dayNum(d.toISOString().slice(0,10))<=maxDay){
      const monthStartDay=Math.max(minDay, dayNum(d.toISOString().slice(0,10)));
      const nextMonth=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1));
      const monthEndDay=Math.min(maxDay, dayNum(nextMonth.toISOString().slice(0,10)));
      const left=(monthStartDay-minDay)*PX_PER_DAY;
      const width=(monthEndDay-monthStartDay)*PX_PER_DAY;
      const cell=document.createElement('div');
      cell.className='ig-month'; cell.style.left=left+'px'; cell.style.width=Math.max(0,width)+'px';
      const label=MONTHS_ES[d.getUTCMonth()]+' '+d.getUTCFullYear();
      cell.title=label;
      if(width>=44) cell.textContent=label;
      wrap.appendChild(cell);
      d=nextMonth;
    }
    const flag=document.createElement('div');
    flag.className='ig-today-flag'; flag.style.left=todayX+'px'; flag.textContent='Hoy';
    wrap.appendChild(flag);
    return wrap;
  }
  function trackBackground(){
    const stops=[];
    let d=new Date(minDay*86400000); d.setUTCDate(1);
    while(dayNum(d.toISOString().slice(0,10))<=maxDay){
      const day=dayNum(d.toISOString().slice(0,10));
      if(day>=minDay){ const x=(day-minDay)*PX_PER_DAY; stops.push(`transparent ${x}px`,`var(--border-soft) ${x}px`,`var(--border-soft) ${x+1}px`,`transparent ${x+1}px`); }
      d=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1));
    }
    stops.push(`transparent ${todayX}px`,`var(--rag-red) ${todayX}px`,`var(--rag-red) ${todayX+1.2}px`,`transparent ${todayX+1.2}px`);
    return `background-image: linear-gradient(to right, ${stops.join(',')}); background-repeat:no-repeat;`;
  }
  const trackBgCss = trackBackground();

  function makeRow(n, level, dim, path){
    const row=document.createElement('div');
    row.className='ig-row'+(dim?' dim':'');
    row.style.display='contents';
    const nPct=Math.max(0,Math.min(100,Math.round(n.pct||0)));
    path=path||[];
    const label=document.createElement('div');
    label.className='ig-cell ig-label'+(n.children.length?' parent':'');
    label.innerHTML = `<div class="ig-label-inner" style="padding-left:${10+level*14}px">
      <svg class="ig-chev ${n.children.length?(expanded.has(n.id)?'open':''):'leaf'}" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 6 15 12 9 18"/></svg>
      <span class="ig-dot" style="background:var(${statusVar(n)})"></span>
      <span class="ig-name ${n.tipo==='Tarea'?'tarea':''}" title="${n.name.replace(/"/g,'&quot;')}">${n.name}${n.est?' <span class="ig-est-flag" title="Fecha estimada">~</span>':''}</span>
      <span class="ig-pct">${nPct}%</span>
    </div>`;
    const chevEl=label.querySelector('.ig-chev');
    if(n.children.length){
      chevEl.addEventListener('click',(e)=>{ e.stopPropagation(); if(expanded.has(n.id)) expanded.delete(n.id); else expanded.add(n.id); renderGrid(); });
    }
    label.addEventListener('click',(e)=>{ if(e.target===chevEl || chevEl.contains(e.target)) return; openModal(n, path); });

    const track=document.createElement('div');
    track.className='ig-cell ig-track';
    track.style.width=TIMELINE_W+'px';
    track.style.cssText += trackBgCss;

    if(n.start && n.due){
      if(n.mile){
        const dia=document.createElement('div');
        dia.className='ig-milestone'; dia.style.left=xFor(n.due)+'px'; dia.style.background=`var(${statusVar(n)})`;
        dia.addEventListener('mouseenter', e=>showTip(e, tipHTML(n)));
        dia.addEventListener('mousemove', moveTip);
        dia.addEventListener('mouseleave', hideTip);
        dia.addEventListener('click', e=>{ e.stopPropagation(); openModal(n, path); });
        track.appendChild(dia);
      } else {
        const left=xFor(n.start);
        const width=Math.max(6, xFor(n.due)-xFor(n.start)+PX_PER_DAY*0.9);
        const bar=document.createElement('div');
        bar.className='ig-bar'; bar.style.left=left+'px'; bar.style.width=width+'px';
        bar.style.background = `var(${statusFillVar(n)})`;
        bar.style.border = `1px ${n.est?'dashed':'solid'} var(${statusVar(n)})`;
        if(n.est) bar.title='Fecha estimada';
        const fill=document.createElement('div');
        fill.className='ig-fill'; fill.style.width=nPct+'%'; fill.style.background=`var(${statusVar(n)})`;
        bar.appendChild(fill);
        bar.addEventListener('mouseenter', e=>showTip(e, tipHTML(n)));
        bar.addEventListener('mousemove', moveTip);
        bar.addEventListener('mouseleave', hideTip);
        bar.addEventListener('click', e=>{ e.stopPropagation(); openModal(n, path); });
        track.appendChild(bar);
        if(level===0 && width<160){
          const lbl=document.createElement('div');
          lbl.className='ig-bar-label'; lbl.textContent = n.name.length>34? n.name.slice(0,34)+'…' : n.name;
          bar.appendChild(lbl);
        }
      }
    } else {
      const nd=document.createElement('div');
      nd.className='ig-no-dates'; nd.textContent='sin fechas';
      track.appendChild(nd);
    }
    row.appendChild(label); row.appendChild(track);
    return row;
  }

  const gridEl = $("grid");
  function renderGrid(){
    gridEl.innerHTML='';
    gridEl.style.setProperty('--ig-label-w', LABEL_W+'px');
    gridEl.style.setProperty('--ig-timeline-w', TIMELINE_W+'px');
    const headRow=document.createElement('div');
    headRow.className='ig-row ig-head-row'; headRow.style.display='contents';
    const headLabel=document.createElement('div');
    headLabel.className='ig-cell ig-head-label'; headLabel.style.height='38px'; headLabel.textContent='Tarea';
    headRow.appendChild(headLabel); headRow.appendChild(buildMonthHeader());
    gridEl.appendChild(headRow);

    const filterActive = statusFilter!=='all' || !!searchQ;
    let count=0;
    function walk(nodes, level, path){
      nodes.forEach(n=>{
        if(filterActive){
          if(!subtreeHasMatch(n)) return;
          gridEl.appendChild(makeRow(n, level, !nodeMatches(n), path));
          count++;
          walk(n.children, level+1, path.concat(n.name));
        } else {
          gridEl.appendChild(makeRow(n, level, false, path));
          count++;
          if(expanded.has(n.id)) walk(n.children, level+1, path.concat(n.name));
        }
      });
    }
    walk(TREE_TECNICO, 0, []);
    if(count===0){
      const empty=document.createElement('div');
      empty.className='ig-empty-msg'; empty.style.gridColumn='1 / -1'; empty.textContent='No hay tareas que coincidan con el filtro.';
      gridEl.appendChild(empty);
    }
    // Línea vertical de "hoy": una sola línea continua superpuesta a todo
    // el grid (encabezado + filas), para que sea inconfundible dónde
    // estamos parados, se filtre lo que se filtre.
    const todayLine=document.createElement('div');
    todayLine.className='ig-today-line';
    todayLine.style.left = `calc(${LABEL_W}px + ${todayX}px)`;
    todayLine.title = 'Hoy: ' + fmtD(TODAY);
    gridEl.appendChild(todayLine);
  }
  renderGrid();
}

/* ---------------------------------------------------------------------
   7.3.1) GANTT POR PERSONA — mismo dataset de ClickUp (TREE_TECNICO), pero
   aplanado: el usuario elige una persona y ve solo las tareas (hojas del
   árbol) que tiene asignadas, ordenadas por fecha de inicio, con la misma
   línea de "hoy" que el Gantt general.
--------------------------------------------------------------------- */
function pgAllPeople(){
  const set = new Set();
  (function walk(nodes){ nodes.forEach(n=>{
    (n.resp||'').split(/[\n\/]+/).map(s=>s.trim()).filter(Boolean).forEach(p=>set.add(p));
    walk(n.children);
  }); })(TREE_TECNICO);
  return [...set].sort((a,b)=>a.localeCompare(b,'es'));
}
function pgTasksFor(person){
  const out = [];
  (function walk(nodes, path){
    nodes.forEach(n=>{
      if(n.children.length===0){
        const people = (n.resp||'').split(/[\n\/]+/).map(s=>s.trim()).filter(Boolean);
        if(people.includes(person)) out.push({node:n, path:path.slice()});
      }
      walk(n.children, path.concat(n.name));
    });
  })(TREE_TECNICO, []);
  out.sort((a,b)=>{
    const as=a.node.start||'9999', bs=b.node.start||'9999';
    return as<bs?-1:as>bs?1:0;
  });
  return out;
}

function mountPersonGantt(id){
  const root = document.getElementById(id+"-wrap");
  if(!root) return;

  const PX_PER_DAY = 5, LABEL_W = 230;
  const $ = (suffix)=>document.getElementById(id+"-"+suffix);
  function toDate(s){ return new Date(s+'T00:00:00Z'); }
  function dayNum(s){ return Math.floor(toDate(s).getTime()/86400000); }
  function fmtD(s){ if(!s) return '—'; const d=toDate(s); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
  const TODAY = todayISO();
  const todayDay = dayNum(TODAY);
  const STATUS_LABEL = {'to do':'Por hacer','in progress':'En progreso','complete':'Completada'};
  function isOverdue(n){ return n.due && n.status!=='complete' && dayNum(n.due)<todayDay; }
  function statusVar(n){ if(isOverdue(n)) return '--rag-red'; if(n.status==='complete') return '--rag-green'; if(n.status==='in progress') return '--rag-amber'; return '--rag-gray'; }

  const people = pgAllPeople();
  const sel = $("personSelect");
  sel.innerHTML = people.map(p=>`<option value="${p.replace(/"/g,'&quot;')}">${p}</option>`).join("");
  if(!people.length){
    $("stats").innerHTML = `<div class="ig-empty-msg">No hay responsables cargados en el export de ClickUp.</div>`;
    return;
  }
  sel.value = people[0];
  sel.addEventListener('change', renderPerson);

  const tooltip = $("tooltip");
  function showTip(evt, html){ tooltip.innerHTML=html; tooltip.classList.add('show'); moveTip(evt); }
  function moveTip(evt){
    const pad=14; let x=evt.clientX+pad, y=evt.clientY+pad; const tw=260, th=90;
    if(x+tw>window.innerWidth) x=evt.clientX-tw-pad;
    if(y+th>window.innerHeight) y=evt.clientY-th-pad;
    tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
  }
  function hideTip(){ tooltip.classList.remove('show'); }

  function renderPerson(){
    const person = sel.value;
    const items = pgTasksFor(person);
    const done = items.filter(it=>it.node.status==='complete').length;
    const prog = items.filter(it=>it.node.status==='in progress').length;
    const late = items.filter(it=>isOverdue(it.node)).length;
    $("stats").innerHTML = `<div class="ig-stat"><div class="n">${items.length}</div><div class="l">Tareas asignadas</div></div>
     <div class="ig-stat"><div class="n">${done}</div><div class="l">Completadas</div></div>
     <div class="ig-stat"><div class="n">${prog}</div><div class="l">En progreso</div></div>
     <div class="ig-stat"><div class="n">${late}</div><div class="l">Atrasadas</div></div>`;

    const gridEl = $("grid");
    gridEl.innerHTML = '';
    if(!items.length){
      gridEl.style.gridTemplateColumns = '1fr';
      gridEl.innerHTML = `<div class="ig-empty-msg">${person} no tiene tareas asignadas en el export de ClickUp.</div>`;
      return;
    }
    let minDay=Infinity, maxDay=-Infinity;
    items.forEach(({node:n})=>{ if(n.start) minDay=Math.min(minDay,dayNum(n.start)); if(n.due) maxDay=Math.max(maxDay,dayNum(n.due)); });
    if(!isFinite(minDay)){ minDay=todayDay-5; maxDay=todayDay+5; }
    minDay-=5; maxDay+=5;
    const TIMELINE_W = Math.max(500, Math.round((maxDay-minDay)*PX_PER_DAY));
    const todayX = (todayDay-minDay)*PX_PER_DAY;
    function xFor(s){ return (dayNum(s)-minDay)*PX_PER_DAY; }

    gridEl.style.gridTemplateColumns = LABEL_W+'px '+TIMELINE_W+'px';
    const headRow=document.createElement('div');
    headRow.className='ig-row ig-head-row'; headRow.style.display='contents';
    const headLabel=document.createElement('div');
    headLabel.className='ig-cell ig-head-label'; headLabel.style.height='34px'; headLabel.textContent='Tarea';
    const headTrack=document.createElement('div');
    headTrack.className='ig-cell'; headTrack.style.height='34px'; headTrack.style.color='var(--text-faint)'; headTrack.style.fontSize='10.5px';
    headTrack.textContent = fmtD(new Date(minDay*86400000).toISOString().slice(0,10))+' — '+fmtD(new Date(maxDay*86400000).toISOString().slice(0,10));
    headRow.appendChild(headLabel); headRow.appendChild(headTrack);
    gridEl.appendChild(headRow);

    items.forEach(({node:n, path})=>{
      const row=document.createElement('div');
      row.style.display='contents';
      const nPct=Math.max(0,Math.min(100,Math.round(n.pct||0)));
      const label=document.createElement('div');
      label.className='ig-cell ig-label';
      label.style.cursor='default';
      label.innerHTML = `<div class="ig-label-inner" style="padding-left:10px;">
        <span class="ig-dot" style="background:var(${statusVar(n)})"></span>
        <span class="ig-name" title="${(path.join(' › ')+' — '+n.name).replace(/"/g,'&quot;')}">${n.name}</span>
        <span class="ig-pct">${nPct}%</span>
      </div>`;
      const track=document.createElement('div');
      track.className='ig-cell ig-track';
      track.style.width=TIMELINE_W+'px';
      if(n.start && n.due){
        const left=xFor(n.start);
        const width=Math.max(6, xFor(n.due)-xFor(n.start)+PX_PER_DAY*0.9);
        const bar=document.createElement('div');
        bar.className='ig-bar'; bar.style.left=left+'px'; bar.style.width=width+'px';
        bar.style.background = `var(${statusVar(n)}-tint)`;
        bar.style.border = `1px ${n.est?'dashed':'solid'} var(${statusVar(n)})`;
        const fill=document.createElement('div');
        fill.className='ig-fill'; fill.style.width=nPct+'%'; fill.style.background=`var(${statusVar(n)})`;
        bar.appendChild(fill);
        bar.addEventListener('mouseenter', e=>showTip(e, `<b>${n.name}</b><div class="ig-tt-row">${path.join(' › ')||'—'}</div><div class="ig-tt-row">${STATUS_LABEL[n.status]||n.status}${isOverdue(n)?' · Atrasada':''}</div><div class="ig-tt-row">${fmtD(n.start)} – ${fmtD(n.due)}</div><div class="ig-tt-row">Avance: ${nPct}%</div>`));
        bar.addEventListener('mousemove', moveTip);
        bar.addEventListener('mouseleave', hideTip);
        track.appendChild(bar);
      } else {
        const nd=document.createElement('div');
        nd.className='ig-no-dates'; nd.textContent='sin fechas';
        track.appendChild(nd);
      }
      row.appendChild(label); row.appendChild(track);
      gridEl.appendChild(row);
    });

    const todayLine=document.createElement('div');
    todayLine.className='ig-today-line';
    todayLine.style.top='34px';
    todayLine.style.left = `calc(${LABEL_W}px + ${todayX}px)`;
    todayLine.title = 'Hoy: '+fmtD(TODAY);
    gridEl.appendChild(todayLine);
  }

  renderPerson();
}

/* ---------------------------------------------------------------------
   7.4) GANTT OPERATIVO (dataset curado del PM) — barras de fecha
   planificada vs. real, línea de "hoy", banderas de atraso por
   porcentaje de la duración planificada, botón para ver el riesgo
   asociado a una tarea atrasada y flechas de dependencia. Las fechas
   reales, dependencias y riesgo asociado sólo se dibujan cuando existen
   en los datos — nunca se inventan (quedan vacías hasta que el PM las
   carga en Backoffice → Cronograma).
--------------------------------------------------------------------- */
const PMG_PX_PER_DAY = 7;
const PMG_LABEL_W = 220;
const PMG_ROW_H = 40;
const PMG_MONTHS_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function pmgDayNum(s){ if(!s) return null; const d = new Date(s+"T00:00:00Z"); if(isNaN(d)) return null; return Math.floor(d.getTime()/86400000); }

/* Bandera de atraso: >0.1% hasta 10% de la duración planificada de la
   tarea → amarilla; más de 10% → roja/crítica. El atraso se mide contra
   la fecha real de fin (tareas completadas) o contra hoy (tareas en
   curso/pendientes vencidas). */
function pmgDelayInfo(t){
  const ps = pmgDayNum(t.inicioPlan), pe = pmgDayNum(t.finPlan);
  if(ps===null || pe===null) return null;
  const totalDur = Math.max(1, pe-ps+1);
  let delayDays = 0;
  if(t.estado==="completado"){
    const fr = pmgDayNum(t.finReal);
    if(fr!==null) delayDays = fr-pe;
  } else {
    const td = pmgDayNum(todayISO());
    if(td>pe) delayDays = td-pe;
  }
  if(delayDays<=0) return null;
  const pct = (delayDays/totalDur)*100;
  if(pct<=0.1) return null;
  return { delayDays, pct, level: pct>10 ? "rojo" : "amarillo" };
}
function pmgFlagBadge(info){
  if(!info) return "";
  const label = info.level==="rojo" ? "⚑ Crítico" : "⚑ Atención";
  return `<span class="pmg-flag ${info.level}" title="${info.delayDays} día${info.delayDays===1?"":"s"} de atraso · ${info.pct.toFixed(1)}% de la duración planificada">${label}</span>`;
}
function riskDetailHTML(t){
  const r = STATE.collections.riesgos.find(rk=>rk.codigo===t.riesgoId);
  if(!r) return `<div class="hint">La tarea tiene un código de riesgo asignado (${t.riesgoId}) que no se encuentra en el registro de riesgos.</div>`;
  const lvl = riskLevel(r.probabilidad, r.impacto);
  return `
    <div class="hint" style="margin-bottom:4px;"><span class="code">${r.codigo}</span> ${riskBadge(lvl.tier)} — <b>${r.descripcion}</b></div>
    <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin:8px 0 2px;">JUSTIFICACIÓN DEL ATRASO — PLAN DE MITIGACIÓN</div>
    <div style="font-size:13px;">${r.plan||"Sin plan de mitigación registrado."}</div>
    ${r.impactoNegocio?`<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin:8px 0 2px;">IMPACTO EN EL NEGOCIO</div><div style="font-size:13px;">${r.impactoNegocio}</div>`:""}
  `;
}

function renderPMGantt(tasks, opts){
  opts = opts || {};
  const withDates = (tasks||[]).filter(t=>t.inicioPlan && t.finPlan);
  if(!withDates.length) return `<div class="hint">Sin tareas con fechas planificadas para graficar.</div>`;
  const todayNum = pmgDayNum(todayISO());
  let minDay = Math.min(todayNum, ...withDates.map(t=>pmgDayNum(t.inicioPlan)));
  let maxDay = Math.max(todayNum, ...withDates.map(t=>pmgDayNum(t.finReal)||pmgDayNum(t.finPlan)));
  minDay -= 5; maxDay += 5;
  const totalW = (maxDay-minDay)*PMG_PX_PER_DAY;
  const critical = computeCriticalPath(withDates);

  let monthsHtml = "";
  let d = new Date(minDay*86400000); d.setUTCDate(1);
  while(Math.floor(d.getTime()/86400000) <= maxDay){
    const cellStart = Math.max(minDay, Math.floor(d.getTime()/86400000));
    const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1));
    const cellEnd = Math.min(maxDay, Math.floor(next.getTime()/86400000));
    const left = (cellStart-minDay)*PMG_PX_PER_DAY;
    const width = Math.max(0,(cellEnd-cellStart)*PMG_PX_PER_DAY);
    monthsHtml += `<span class="pmg-month" style="left:${left}px; width:${width}px;">${PMG_MONTHS_ES[d.getUTCMonth()]} ${d.getUTCFullYear()}</span>`;
    d = next;
  }

  const idxByName = new Map(withDates.map((t,i)=>[t.nombre, i]));
  const rowsHtml = withDates.map((t,i)=>{
    const ps = pmgDayNum(t.inicioPlan), pe = pmgDayNum(t.finPlan);
    const planLeft = (ps-minDay)*PMG_PX_PER_DAY, planW = Math.max(6,(pe-ps+1)*PMG_PX_PER_DAY);
    const info = pmgDelayInfo(t);
    let realHtml = "";
    if(t.inicioReal || t.finReal){
      const rs = t.inicioReal ? pmgDayNum(t.inicioReal) : ps;
      const re = t.finReal ? pmgDayNum(t.finReal) : (t.estado!=="completado" ? todayNum : pe);
      const realLeft = (rs-minDay)*PMG_PX_PER_DAY, realW = Math.max(6,(re-rs+1)*PMG_PX_PER_DAY);
      const realColor = info ? (info.level==="rojo"?"var(--rag-red)":"var(--rag-amber)") : "var(--primary)";
      realHtml = `<div class="gantt-real" style="left:${realLeft}px; width:${realW}px; background:${realColor};" title="Real: ${fmtDate(t.inicioReal)} – ${t.finReal?fmtDate(t.finReal):'en curso'}"></div>`;
    }
    let riskBtn = "";
    if(info){
      riskBtn = t.riesgoId
        ? `<button type="button" class="pmg-riskbtn" data-pmgrisk="${t.id}">Ver riesgo asociado</button>`
        : `<span class="pmg-riskbtn muted">Riesgo por asignar</span>`;
    }
    return `<div class="gantt-row${critical.has(t)?' gantt-row--critical':''}${opts.editable?' pmg-editrow':''}" data-pmgtask="${t.id}" style="min-height:${PMG_ROW_H}px;">
      <div class="gantt-label" style="width:${PMG_LABEL_W}px;flex:0 0 ${PMG_LABEL_W}px;">
        <b>${t.nombre}${pmgFlagBadge(info)}</b>
        <span>${t.fase||""}${t.frenteCodigo?' · '+t.frenteCodigo:''}</span>
        ${riskBtn}
      </div>
      <div class="gantt-track" style="width:${totalW}px;">
        <div class="gantt-plan" style="left:${planLeft}px; width:${planW}px;" title="Plan: ${fmtDate(t.inicioPlan)} – ${fmtDate(t.finPlan)}"></div>
        ${realHtml}
      </div>
    </div>`;
  }).join("");

  let arrows = "";
  withDates.forEach((t,i)=>{
    (t.dependencias||[]).forEach(depName=>{
      const j = idxByName.get(depName);
      if(j===undefined || j===i) return;
      const pred = withDates[j];
      const pe2 = pmgDayNum(pred.finPlan);
      const ps2 = pmgDayNum(t.inicioPlan);
      if(pe2===null || ps2===null) return;
      const x1 = PMG_LABEL_W + (pe2-minDay+1)*PMG_PX_PER_DAY;
      const y1 = j*PMG_ROW_H + PMG_ROW_H/2;
      const x2 = PMG_LABEL_W + (ps2-minDay)*PMG_PX_PER_DAY;
      const y2 = i*PMG_ROW_H + PMG_ROW_H/2;
      const midX = (x1+x2)/2;
      arrows += `<path d="M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}" />`;
    });
  });

  const totalHeight = withDates.length*PMG_ROW_H;
  const panelId = opts.panelId || "pmgRiskPanel";
  return `
    <div class="gantt-wrap">
      <div class="gantt" style="min-width:${PMG_LABEL_W+totalW}px;">
        <div class="gantt-months" style="position:relative; height:24px; margin-left:${PMG_LABEL_W}px; width:${totalW}px; padding-left:0;">${monthsHtml}</div>
        <div style="position:relative;">
          ${rowsHtml}
          <div class="gantt-today" style="left:${PMG_LABEL_W+(todayNum-minDay)*PMG_PX_PER_DAY}px; height:${totalHeight}px;" title="Hoy: ${fmtDate(todayISO())}"></div>
          ${arrows ? `<svg style="position:absolute; top:0; left:0; width:${PMG_LABEL_W+totalW}px; height:${totalHeight}px; pointer-events:none;"><defs><marker id="pmgArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--text-faint)"/></marker></defs><g fill="none" stroke="var(--text-faint)" stroke-width="1.5" marker-end="url(#pmgArrow)">${arrows}</g></svg>` : ""}
        </div>
      </div>
    </div>
    <div class="legend">
      <span><i style="border:1.5px dashed var(--text-faint); background:none;"></i>Fecha planificada</span>
      <span><i style="background:var(--primary);"></i>Fecha real</span>
      <span><i style="background:var(--rag-amber);"></i>Atraso 0,1%–10% de la duración</span>
      <span><i style="background:var(--rag-red);"></i>Atraso mayor a 10%</span>
      <span><i style="background:var(--accent);width:2px;"></i>Hoy</span>
    </div>
    <div class="pmg-riskpanel" id="${panelId}" hidden></div>
  `;
}

function bindPMGantt(opts){
  opts = opts || {};
  const panelId = opts.panelId || "pmgRiskPanel";
  const panel = document.getElementById(panelId);
  document.querySelectorAll("[data-pmgrisk]").forEach(b=>b.addEventListener("click", (e)=>{
    e.stopPropagation();
    const t = STATE.collections.gantt.find(x=>x.id===b.dataset.pmgrisk);
    if(!panel || !t) return;
    if(!panel.hidden && panel.dataset.task===t.id){ panel.hidden = true; return; }
    panel.innerHTML = riskDetailHTML(t);
    panel.dataset.task = t.id;
    panel.hidden = false;
  }));
  if(opts.editable){
    document.querySelectorAll("[data-pmgtask]").forEach(row=>row.addEventListener("click", (e)=>{
      if(e.target.closest("[data-pmgrisk]")) return;
      editingId = row.dataset.pmgtask;
      renderAdminBody();
      const form = document.getElementById("genForm");
      if(form){ try{ form.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){} }
    }));
  }
}

function viewRiesgos(){
  const riesgos = STATE.collections.riesgos;
  const counts = {};
  for(let p=1;p<=3;p++) for(let i=1;i<=3;i++) counts[p+"-"+i]=0;
  riesgos.forEach(r=>{ const k=r.probabilidad+"-"+r.impacto; if(counts[k]!==undefined) counts[k]++; });
  const cellColor = (p,i)=>{ const lvl=riskLevel(p,i); return `background:${riskVar(lvl.tier)};`; };
  const rowsHtml = (r, idPrefix)=>{
    idPrefix = idPrefix || "risk";
    return `<tr class="decisionrow" data-toggle="${idPrefix}-${r.id}">
      <td><span class="code">${r.codigo}</span>${r.esTop?' <span class="chip amarillo" style="margin-left:4px;">TOP</span>':''}</td>
      <td style="max-width:320px;">${r.descripcion}<div class="fcomment" style="font-size:11.5px;color:var(--text-faint);margin-top:3px;"><b>Causa:</b> ${r.disparador||"—"}</div></td>
      <td>${r.categoria||""}</td>
      <td>${r.probabilidad}×${r.impacto}</td>
      <td>${r.estrategia||""}</td>
      <td>${r.responsable||""}</td>
      <td>${chip(riskEstadoRag(r.estado), riskEstadoLabel(r.estado))}</td>
    </tr>
    <tr class="decisiondetail" id="${idPrefix}-${r.id}" hidden>
      <td colspan="7">
        <div class="hint" style="margin-bottom:6px;"><b>Impacto en el negocio:</b> ${r.impactoNegocio||"—"}</div>
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin:8px 0 4px;">PLAN DE MITIGACIÓN</div>
        <div style="font-size:13px;">${r.plan||"Sin plan registrado."}</div>
        <div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:12.5px;color:var(--text-muted);">
          ${r.equipoResponsable?`<div><b>Equipo responsable:</b> ${r.equipoResponsable}</div>`:""}
          ${r.proveedores?`<div><b>Proveedores:</b> ${r.proveedores}</div>`:""}
          ${r.identificadoPor?`<div><b>Identificado por:</b> ${r.identificadoPor}</div>`:""}
          ${r.etapa?`<div><b>Etapa:</b> ${r.etapa}</div>`:""}
          ${r.fechaLimite?`<div><b>Fecha límite:</b> ${fmtDate(r.fechaLimite)}</div>`:""}
        </div>
        ${r.observacionesGSE?`<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin:10px 0 4px;">OBSERVACIONES GSE</div><div style="font-size:13px;">${r.observacionesGSE}</div>`:""}
        ${r.accionObservacion?`<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin:10px 0 4px;">ACCIÓN A LA OBSERVACIÓN</div><div style="font-size:13px;">${r.accionObservacion}</div>`:""}
      </td>
    </tr>`;
  };

  return `
    <div class="section-head">
      <div class="eyebrow">PMBOK · Gestión de riesgos</div>
      <h2>Mapa de riesgos</h2>
      <p>Matriz de calor probabilidad × impacto (escala 1–3) y registro de riesgos agrupado por criticidad: Crítico, Alto, Medio y Bajo. Clic en una fila para ver impacto en el negocio, plan de mitigación completo y observaciones.</p>
    </div>

    <div class="card panel">
      <h3>Matriz de calor (3×3)</h3>
      <div class="hint">Cantidad de riesgos registrados por combinación de probabilidad e impacto.</div>
      <div class="matrix">
        <div class="axis-y">Probabilidad</div>
        ${[3,2,1].map(p=>[1,2,3].map(i=>`<div class="cell" style="${cellColor(p,i)}">${counts[p+"-"+i]}</div>`).join("")).join("")}
        <div></div><div class="axis-x">Bajo</div><div class="axis-x">Medio</div><div class="axis-x">Alto</div>
      </div>
      <div class="legend">
        ${RISK_TIERS.slice().reverse().map(t=>`<span><i style="background:var(--risk-${t.key});"></i>${t.label} (score ≥${t.min})</span>`).join("")}
      </div>
    </div>

    ${(()=>{
      const frentesActivos = STATE.collections.frentes.filter(f=>f.semaforo && f.semaforo!=="gris").map(f=>"F"+f.orden);
      const top10 = riesgos.filter(r=>r.frenteCodigo && frentesActivos.includes(r.frenteCodigo))
        .sort((a,b)=>riskLevel(b.probabilidad,b.impacto).score-riskLevel(a.probabilidad,a.impacto).score)
        .slice(0,10);
      return `
      <div class="card panel">
        <h3>Top 10 — riesgos de los frentes activos</h3>
        <div class="hint">Los 10 riesgos de mayor severidad (probabilidad × impacto) entre los vinculados a frentes con actividad en curso hoy (semáforo distinto de gris: ${frentesActivos.join(", ")||"ninguno"}). Frentes sin riesgo vinculado en la matriz quedan fuera de este listado.</div>
        <div class="tablewrap"><table>
          <thead><tr><th>Código</th><th>Riesgo</th><th>Categoría</th><th>P×I</th><th>Estrategia</th><th>Responsable</th><th>Estado</th></tr></thead>
          <tbody>${top10.map(r=>rowsHtml(r,"risktop")).join("") || `<tr><td colspan="7" class="hint">Ningún riesgo de la matriz está vinculado hoy a un frente activo.</td></tr>`}</tbody>
        </table></div>
      </div>`;
    })()}

    ${RISK_TIERS.map(tier=>{
      const items = riesgos.filter(r=>riskLevel(r.probabilidad,r.impacto).tier===tier.key).sort((a,b)=>riskLevel(b.probabilidad,b.impacto).score-riskLevel(a.probabilidad,a.impacto).score);
      if(!items.length) return "";
      return `
      <div class="card panel">
        <h3 class="risktier-head">${riskBadge(tier.key)} <span>${items.length} riesgo${items.length===1?"":"s"}</span></h3>
        <div class="tablewrap"><table>
          <thead><tr><th>Código</th><th>Riesgo</th><th>Categoría</th><th>P×I</th><th>Estrategia</th><th>Responsable</th><th>Estado</th></tr></thead>
          <tbody>${items.map(rowsHtml).join("")}</tbody>
        </table></div>
      </div>`;
    }).join("") || `<div class="card panel"><div class="hint">Sin riesgos registrados.</div></div>`}
  `;
}

function flagBadge(active){
  return active ? `<span class="flagbadge on" title="Alerta activa — requiere escalación">🚩 Alerta</span>` : `<span class="flagbadge off">Sin alerta</span>`;
}
function updatesLog(arr){
  if(!Array.isArray(arr) || !arr.length) return `<div class="hint">Sin actualizaciones registradas.</div>`;
  const sorted = [...arr].sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
  return `<ul class="updateslog">${sorted.map(u=>`<li><span class="ulog-date">${fmtDate(u.fecha)}</span><span class="ulog-autor">${u.autor||"—"}</span><span class="ulog-nota">${u.nota||""}</span></li>`).join("")}</ul>`;
}

          ${items.map(p=>`
            <tr class="decisionrow" data-toggle="prob-${p.id}">

/* Lee los valores de un formulario genérico (contenedor con inputs [data-k])
   según el esquema de la colección — usado tanto por el CRUD genérico como
   por la vista previa de actas subidas en PPT. */
function readFormValues(container, schema){
  const data = {};
  container.querySelectorAll("[data-k]").forEach(inp=>{
    const key = inp.dataset.k;
    const fieldDef = schema.fields.find(f=>f.key===key);
    if(!fieldDef) return;
    if(fieldDef.type==="checkbox"){ data[key] = !!inp.checked; return; }
    let v = inp.value;
    if(fieldDef.type==="number") v = v===""?null:Number(v);
    if(fieldDef.type==="select"){
      const opt = fieldDef.options.find(([ov])=>String(ov)===String(v));
      v = opt ? opt[0] : v;
    }
    if(fieldDef.type==="tags") v = v.split("\n").map(s=>s.trim()).filter(Boolean);
    if(fieldDef.type==="actions3") v = v.split("\n").map(s=>s.trim()).filter(Boolean).map(line=>{
      const parts = line.split("|").map(s=>s.trim());
      return { accion:parts[0]||"", responsable:parts[1]||"", fecha:parts[2]||"" };
    });
    if(fieldDef.type==="updates") v = v.split("\n").map(s=>s.trim()).filter(Boolean).map(line=>{
      const parts = line.split("|").map(s=>s.trim());
      return { fecha:parts[0]||"", autor:parts[1]||"", nota:parts[2]||"" };
    });
    data[key] = v;
  });
  return data;
}

function fieldInput(f, val){
  const v = val===undefined||val===null?"":val;
  if(f.type==="select"){
    return `<select data-k="${f.key}">${f.options.map(([ov,ol])=>`<option value="${ov}" ${String(v)===String(ov)?'selected':''}>${ol}</option>`).join("")}</select>`;
  }
  if(f.type==="textline"){
    return `<textarea data-k="${f.key}" rows="2">${v}</textarea>`;
  }
  if(f.type==="tags"){
    const arr = Array.isArray(v)?v.join("\n"):v;
    return `<textarea data-k="${f.key}" data-tags="1" rows="3" placeholder="Uno por línea">${arr}</textarea>`;
  }
  if(f.type==="actions3"){
    const arr = Array.isArray(v) ? v.map(o=>`${o.accion||""} | ${o.responsable||""} | ${o.fecha||""}`).join("\n") : (v||"");
    return `<textarea data-k="${f.key}" data-actions3="1" rows="4" placeholder="Acción | Responsable | Fecha">${arr}</textarea>`;
  }
  if(f.type==="updates"){
    const arr = Array.isArray(v) ? v.map(o=>`${o.fecha||""} | ${o.autor||""} | ${o.nota||""}`).join("\n") : (v||"");
    return `<textarea data-k="${f.key}" data-updates="1" rows="4" placeholder="2026-09-01 | Jorge Torres | Nota de la actualización">${arr}</textarea>`;
  }
  if(f.type==="checkbox"){
    return `<label class="checkboxfield"><input type="checkbox" data-k="${f.key}" data-checkbox="1" ${v===true?"checked":""}><span>${f.label}</span></label>`;
  }
  return `<input data-k="${f.key}" type="${f.type}" value="${v}">`;
}

function colDisplay(val, fieldDef){
  if(fieldDef && fieldDef.type==="checkbox") return val===true ? (fieldDef.key==="alertaRoja"?flagBadge(true):"Sí") : (fieldDef.key==="alertaRoja"?flagBadge(false):"—");
  if(Array.isArray(val)){
    if(!val.length) return "";
    if(typeof val[0]==="object") return `${val.length} registro${val.length===1?"":"s"}`;
    return val.join(", ");
  }
  if(val===null||val===undefined||val==="") return "";
  return val;
}

function parseCSV(text){
  const rows = text.split(/\r?\n/).filter(r=>r.trim().length);
  return rows.map(r=>{
    const out=[]; let cur=""; let q=false;
    for(let i=0;i<r.length;i++){
      const ch = r[i];
      if(ch==='"'){ q=!q; continue; }
      if(ch===','&&!q){ out.push(cur); cur=""; continue; }
      cur+=ch;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  });
}

function bindCsvImporter(){
  const input = document.getElementById("csvFile");
  if(!input) return;
  input.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const rows = parseCSV(reader.result);
      if(rows.length<2){ toast("El CSV no tiene filas de datos.", true); return; }
      const headers = rows[0];
      const dataRows = rows.slice(1);
      const targets = [["","(no importar)"],["nombre","Tarea / nombre"],["fase","Fase / lista"],["responsable","Responsable"],["inicioPlan","Inicio plan"],["finPlan","Fin plan"],["avance","Avance (%)"],["estado","Estado"],["frenteCodigo","Frente EDT (código F1–F6)"]];
      const guess = (h) => {
        const hl = h.toLowerCase();
        if(hl.includes("task name")||hl.includes("nombre")) return "nombre";
        if(hl.includes("list")||hl.includes("fase")) return "fase";
        if(hl.includes("assignee")||hl.includes("responsable")) return "responsable";
        if(hl.includes("start")) return "inicioPlan";
        if(hl.includes("due")||hl.includes("end")) return "finPlan";
        if(hl.includes("status")||hl.includes("estado")) return "estado";
        return "";
      };
      const mapArea = document.getElementById("csvMapArea");
      mapArea.innerHTML = `
        <div class="hint">${dataRows.length} filas detectadas. Confirma a qué campo corresponde cada columna del CSV antes de importar.</div>
        <div class="tablewrap"><table class="maptable"><thead><tr><th>Columna CSV</th><th>Ejemplo</th><th>Mapear a</th></tr></thead>
        <tbody>${headers.map((h,i)=>`<tr><td>${h}</td><td class="fcomment">${(dataRows[0]&&dataRows[0][i])||""}</td><td><select data-col="${i}">${targets.map(([tv,tl])=>`<option value="${tv}" ${guess(h)===tv?'selected':''}>${tl}</option>`).join("")}</select></td></tr>`).join("")}</tbody>
        </table></div>
        <button class="btn primary sm" id="csvImportBtn" style="margin-top:12px;">Importar ${dataRows.length} tareas</button>
      `;
      document.getElementById("csvImportBtn").addEventListener("click", async ()=>{
        const mapping = {};
        mapArea.querySelectorAll("[data-col]").forEach(sel=>{ if(sel.value) mapping[sel.dataset.col]=sel.value; });
        let count=0;
        for(const row of dataRows){
          const item = {estado:"pendiente", avance:0};
          Object.entries(mapping).forEach(([colIdx,field])=>{
            let v = row[colIdx];
            if(field==="avance") v = Number(String(v).replace(/[^0-9.]/g,""))||0;
            if((field==="inicioPlan"||field==="finPlan") && v){ const d=new Date(v); if(!isNaN(d)) v=d.toISOString().slice(0,10); }
            item[field]=v;
          });
          if(item.nombre){ await dbSet("gantt", null, item); count++; }
        }
        toast(`Importadas ${count} tareas desde ClickUp CSV.`);
        mapArea.innerHTML = "";
        input.value = "";
      });
    };
    reader.readAsText(file);
  });
}

async function extractPptxText(file){
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const slideFiles = Object.keys(zip.files)
    .filter(name=>/^ppt\/slides\/slide\d+\.xml$/.test(name))
    .sort((a,b)=>Number(a.match(/slide(\d+)\.xml/)[1]) - Number(b.match(/slide(\d+)\.xml/)[1]));
  const decodeXmlEntities = (s) => s
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&amp;/g,"&");
  const parts = [];
  for(const name of slideFiles){
    const xml = await zip.file(name).async("string");
    const texts = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>decodeXmlEntities(m[1])).filter(Boolean);
    if(texts.length) parts.push(`--- Diapositiva ${parts.length+1} ---\n` + texts.join(" "));
  }
  return parts.join("\n\n");
}

function bindActaReview(){
  const discardBtn = document.getElementById("actaDiscardBtn");

    document.getElementById("actaReviewArea").innerHTML = "";

    if(fileInput) fileInput.value = "";
  });
  if(!applyBtn) return;
  applyBtn.addEventListener("click", async ()=>{
    applyBtn.disabled = true; applyBtn.textContent = "Aplicando…";

    // FASE 1 — leer TODO del DOM primero (a memoria plana). Importante: cada
    // dbSet dispara un re-render en vivo (la base de datos es reactiva) que
    // puede reconstruir #adminBody y borrar el resto de esta vista previa a
    // mitad de camino — por eso no se lee el DOM entre una escritura y otra.
    const pending = [];
    const includeMinuta = document.getElementById("actaIncludeMinuta");
    if(includeMinuta && includeMinuta.checked){

    document.querySelectorAll(".acta-proposal").forEach(card=>{
      const include = card.querySelector(".acta-include");
      if(!include || !include.checked) return;
      const col = card.dataset.col;
      const schema = SCHEMAS[col];
      const data = readFormValues(card, schema);
      const existing = data.codigo ? STATE.collections[col].find(x=>x.codigo===data.codigo) : null;
      pending.push({ col, id: existing ? existing.id : null, data });
    });

    // FASE 2 — escribir, ya sin volver a tocar el DOM de la vista previa.
    for(const w of pending){ await dbSet(w.col, w.id, w.data); }
    await dbSetConfig({}); // refresca fechaActualizacion — se nota en el topbar y en toda la plataforma

    toast(`Acta aplicada: ${pending.length} registro(s) actualizados.`);
    const reviewArea = document.getElementById("actaReviewArea");
    if(reviewArea) reviewArea.innerHTML = "";
    const statusEl = document.getElementById("actaStatus");
    if(statusEl) statusEl.textContent = "Aplicado — los cambios ya están reflejados en el dashboard.";
    const fileInput = document.getElementById("actaFile");
    if(fileInput) fileInput.value = "";
  });
}

function bindActaUploader(){
  const input = document.getElementById("actaFile");
  if(!input) return;
  input.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("actaStatus");
    const reviewArea = document.getElementById("actaReviewArea");
    reviewArea.innerHTML = "";
    statusEl.textContent = "Leyendo el archivo PPTX…";

    let actaText;
    try{ actaText = await extractPptxText(file); }
    catch(err){ statusEl.textContent = "No se pudo leer el archivo. ¿Es un .pptx válido?"; return; }
    if(!actaText || !actaText.trim()){ statusEl.textContent = "No se encontró texto en las diapositivas de este archivo."; return; }

    statusEl.textContent = "Analizando el acta con IA…";
    let sample = null;
    try{ sample = await window.claude.use("sample"); }catch(err){ sample = null; }
    if(!sample){ statusEl.textContent = "La función de análisis con IA no está disponible en este visor."; return; }

    try{
      const proposal = await sample.json(buildActaPrompt(actaText.slice(0,18000)));
      statusEl.textContent = "Propuesta lista — revisa y ajusta cada campo antes de aplicar. Nada se ha guardado todavía.";
      reviewArea.innerHTML = renderActaReview(proposal);
      bindActaReview();
    }catch(err){
      statusEl.textContent = "No se pudo analizar el acta (" + ((err && err.code) || "error") + "). Puedes intentar de nuevo.";
    }
  });
}

function render(){
  if(!STATE.ready) return;
  renderNav();
  const base = routeBase(STATE.route);
  const param = routeParam(STATE.route);
  let title, crumb;
  if(base==="frente"){
    const f = frenteByCodigo(param);
    title = f ? f.nombre : "Frente de trabajo";
    crumb = "Detalle de actividades" + (f?` · ${f.codigo}`:"");
  } else if(base==="pmo-dominio"){
    const d = DOMINIOS_PMBOK.find(x=>x.key===param);
    title = d ? d.nombre : "Dominio de desempeño";
    crumb = "PMO Integrada · 8 dominios (PMBOK 7)";
  } else {
    [title, crumb] = TITLES[base] || TITLES.resumen;
  }
  document.getElementById("pageTitle").textContent = title;
  document.getElementById("pageCrumb").textContent = "Toborochi · " + crumb;
  document.getElementById("updatedText").textContent = STATE.offline ? "Modo demo — sin conexión a datos en vivo" : ("Actualizado " + fmtDate(STATE.config.fechaActualizacion));
  document.getElementById("liveDot").style.background = STATE.offline ? "var(--rag-gray)" : "var(--rag-green)";

  const root = document.getElementById("viewRoot");
  const viewFns = {
    resumen:viewResumen, edt:viewEDT, cronograma:viewCronograma, presupuesto:viewPresupuesto,
    riesgos:viewRiesgos, problemas:viewProblemas, cambios:viewCambios,
    decisiones:viewDecisiones, hitos:viewHitos, minutas:viewMinutas, backoffice:viewBackoffice,
    "pmo-estado":viewPMOEstado, "pmo-dominios":viewPMODominios,
    "tec-resumen":viewTecResumen, "tec-cronograma":viewTecCronograma, "tec-gantt-persona":viewTecGanttPersona, "tec-edt":viewTecEDT,
    "tec-riesgos":viewTecRiesgos, "tec-bitacora":viewTecBitacora, "tec-proximos":viewTecProximos,
  };
  if(base==="frente"){
    root.innerHTML = viewFrenteDetalle(param);
  } else if(base==="pmo-dominio"){
    root.innerHTML = viewPMODominioDetalle(param);
  } else {
    const fn = viewFns[base] || viewResumen;
    root.innerHTML = fn();
  }

  if(base==="backoffice" && !STATE.backofficeUnlocked){
    const bofForm = document.getElementById("bofPassForm");
    if(bofForm) bofForm.addEventListener("submit", (e)=>{
      e.preventDefault();
      const val = document.getElementById("bofPassInput").value;
      if(val === "coco"){
        STATE.backofficeUnlocked = true;
        try{ sessionStorage.setItem("toborochi_backoffice_unlocked", "1"); }catch(e){}
        render();
      } else {
        const err = document.getElementById("bofPassError");
        if(err) err.hidden = false;
        document.getElementById("bofPassInput").focus();
      }
    });
  } else if(base==="backoffice" && (STATE.isAdmin||STATE.offline)){
    document.querySelectorAll("[data-atab]").forEach(b=>b.addEventListener("click", ()=>{ adminTab=b.dataset.atab; editingId=null; render(); }));
    renderAdminBody();
  }
  if(base==="cronograma"){ mountInteractiveGantt("igc"); bindPMGantt({editable:false, panelId:"pmgRiskPanel"}); }
  if(base==="tec-cronograma") mountInteractiveGantt("igt");
  if(base==="tec-gantt-persona") mountPersonGantt("pg");
}


/* ---------------------------------------------------------------------
   9) ARRANQUE
--------------------------------------------------------------------- */

(function boot(){
  initLogin();
  const initialRoute = location.hash.replace("#","");
  if(STATE.role){
    STATE.route = initialRoute || ROLE_DEFAULT_ROUTE[STATE.role] || "resumen";
  } else if(initialRoute){
    STATE.route = initialRoute; // se aplica recién después del login
  }
  initData();
})();
</script>
